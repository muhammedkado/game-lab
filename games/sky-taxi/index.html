<script>
'use strict';
// Sky Taxi: a rooftop vertiport in a modern Arab city at night is jammed with electric air taxis.
// Tap a taxi whose take-off lane is clear: it hovers out, glides to a boarding gate, travellers in
// matching hoodies board, and the full taxi lifts off into the city lights. The rules, the
// solver-checked dealer and the round-2 items come from Caravan Jam, resized for 1-cell taxis and
// 2-cell shuttles. The art is Dreamina's (assets/provenance.yaml); code draws the pads, lanes,
// rotor blur, shadows, gates, charging covers and every HUD icon.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.gates is CONFIG.gates.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: portrait phone
const PIXEL = false;
const FONT = 'Almarai, "SF Arabic", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif'; // Almarai: vendor/almarai.css
const TITLE = 'تاكسي السحاب · Sky Taxi';
const CONTROLS = [
  'اضغط تاكسي مساره مفتوح ليطير إلى بوابة',
  'يركب المسافرون التاكسي الذي بلون ملابسهم',
  'الأسهم: اختيار · مسافة: إقلاع',
  'U تراجع · R إعادة · M صوت',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const screenCtx = canvas.getContext('2d');
let ctx = screenCtx;
let bgCanvas = null, bgKey = '';
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  screenCtx.setTransform(r, 0, 0, r, 0, 0); screenCtx.imageSmoothingEnabled = !PIXEL;
  bgKey = '';
}
addEventListener('resize', fit); fit();
const AR = /[؀-ۿ]/;
function text(s, x, y, size, c, align = 'center', weight = 700) {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.direction = AR.test(s) ? 'rtl' : 'ltr';
  ctx.fillText(s, x, y); ctx.direction = 'ltr';
}
function textOutline(s, x, y, size, c, outline, lw) {
  ctx.font = `800 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.direction = AR.test(s) ? 'rtl' : 'ltr'; ctx.lineJoin = 'round';
  ctx.strokeStyle = outline; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y); ctx.direction = 'ltr';
}

// ---- Input: keys by position (event.code), OS key repeat ignored; taps queued for the step --
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());
const tapQueue = []; let taps = [];
let hoverP = null; // a mouse pointer over the deck shows that taxi's take-off lane (desktop only)
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); startAudio();
  tapQueue.push(toLogical(e));
});
canvas.addEventListener('pointermove', e => { e.preventDefault(); hoverP = e.pointerType === 'mouse' ? toLogical(e) : null; });
canvas.addEventListener('pointerleave', () => { hoverP = null; });
['pointerup', 'pointercancel'].forEach(n => canvas.addEventListener(n, e => e.preventDefault()));
canvas.addEventListener('contextmenu', e => e.preventDefault());
function inRect(p, x, y, w, h) { return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const AC = window.GAME_AUDIO ? null : (window.AudioContext || window.webkitAudioContext);
    if (!window.GAME_AUDIO && !AC) return;
    const ac = window.GAME_AUDIO || new AC(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
// A pitch glide (rotors spinning up) and a filtered noise rush (the whoosh), both made here.
function sweep(f0, f1, dur, type, vol, delay = 0) {
  if (!audio || muted) return;
  try {
    const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* a stand-in audio context may not have ramps */ }
}
let noiseBuf = null;
function rush(dur, f0, f1, vol, delay = 0) {
  if (!audio || muted) return;
  try {
    const ac = audio.ac;
    if (!noiseBuf) {
      const n = Math.floor(ac.sampleRate * 1.2); noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let k = 0; k < n; k++) d[k] = hash(k, 77) * 2 - 1;
    }
    const t = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(audio.out); src.start(t); src.stop(t + dur + 0.05);
  } catch (e) { /* a stand-in audio context may not make noise */ }
}
const sfx = {
  tap() { sweep(160, 520, 0.22, 'sawtooth', 0.06); tone(660, 0.07, 'sine', 0.16, 0.05); },
  blocked() { tone(140, 0.12, 'square', 0.1); tone(104, 0.2, 'square', 0.09, 0.09); },
  dock() { tone(784, 0.09, 'sine', 0.18); tone(1175, 0.16, 'sine', 0.14, 0.07); },
  board(k) { tone(660 + k * 70, 0.07, 'sine', 0.2); },
  spin() { sweep(90, 340, 0.4, 'sawtooth', 0.05); },
  whoosh() { rush(0.9, 300, 2600, 0.5); sweep(200, 900, 0.7, 'triangle', 0.08); },
  stuck() { tone(392, 0.2, 'sawtooth', 0.1); tone(330, 0.2, 'sawtooth', 0.1, 0.17); tone(247, 0.45, 'sawtooth', 0.1, 0.34); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.28, 'triangle', 0.18, i * 0.09)); },
  undo() { tone(523, 0.07, 'sine', 0.2); tone(392, 0.1, 'sine', 0.2, 0.06); },
  ui() { tone(880, 0.05, 'sine', 0.16); },
};

// ---- Saved personal bests (the game works without storage) -------------------------------
const SAVE_KEY = 'sky-taxi-save-v1';
let save = { stars: [], unlocked: 1 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.stars)) save = s; } catch (e) { /* no storage */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* no storage */ } }
function totalStars() { return save.stars.reduce((a, b) => a + (b || 0), 0); }

// ---- Local play log (S1): honest per-level numbers for the owner's playtests, on this device only --
// An attempt counts from its first taxi tap; firstTryWin is 1 when the very first attempt was won.
const LOG_KEY = 'gamelab:sky-taxi:log';
let playLog = { v: 1, levels: {} };
try { const s = JSON.parse(localStorage.getItem(LOG_KEY)); if (s && s.levels && typeof s.levels === 'object') playLog = s; } catch (e) { /* no storage */ }
function logRec(L) {
  const k = String(L);
  return playLog.levels[k] || (playLog.levels[k] = { attempts: 0, wins: 0, stuck: 0, firstTryWin: null, bestTime: null, undos: 0, extraGates: 0 });
}
function logSave() { try { localStorage.setItem(LOG_KEY, JSON.stringify(playLog)); } catch (e) { /* no storage */ } }
function logClear() { playLog = { v: 1, levels: {} }; logSave(); }
function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }

// ---- Small drawing helpers ----------------------------------------------------------------
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeInOut = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeIn = u => 1 - Math.cos(u * Math.PI / 2);
function hash(a, b = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function drawStar(x, y, r, on) {
  starPath(x, y, r); ctx.fillStyle = on ? '#ffd34d' : 'rgba(150,175,205,0.22)'; ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.13); ctx.strokeStyle = on ? '#a86b00' : 'rgba(190,220,250,0.5)'; ctx.lineJoin = 'round'; ctx.stroke();
}
function checkMark(x, y, s, c) {
  ctx.strokeStyle = c; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.12, y + s * 0.32); ctx.lineTo(x + s * 0.5, y - s * 0.38); ctx.stroke();
}
function crossMark(x, y, s, c) {
  ctx.strokeStyle = c; ctx.lineWidth = s * 0.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * 0.36, y - s * 0.36); ctx.lineTo(x + s * 0.36, y + s * 0.36);
  ctx.moveTo(x + s * 0.36, y - s * 0.36); ctx.lineTo(x - s * 0.36, y + s * 0.36); ctx.stroke();
}
function dashMark(x, y, c) { ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 11, y); ctx.lineTo(x + 11, y); ctx.stroke(); }
// A drawn question mark and a charging bolt (no font symbols): the charging cover's two signs.
function qMark(x, y, s, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.15;
  ctx.beginPath(); ctx.arc(x, y - s * 0.19, s * 0.2, Math.PI * 1.05, Math.PI * 2.35); ctx.lineTo(x, y + s * 0.12); ctx.stroke();
  ell(x, y + s * 0.37, s * 0.09, s * 0.09); ctx.fill(); ctx.restore();
}
function bolt(x, y, s, col) {
  const P = [[0.12, -0.5], [-0.28, 0.06], [-0.02, 0.06], [-0.12, 0.5], [0.28, -0.08], [0.02, -0.08]];
  ctx.beginPath(); P.forEach(([a, b], k) => k ? ctx.lineTo(x + a * s, y + b * s) : ctx.moveTo(x + a * s, y + b * s)); ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
}

// ---- The art: Dreamina images in assets/ (provenance.yaml), loaded as plain Image objects ------
// Relative paths and no fetch, so the game still opens from file:// and plays offline. Until every
// image has loaded (or failed), a drawn loading screen shows; a failed image falls back to code.
const COLOURS = ['red', 'blue', 'green', 'yellow', 'purple'];
const ART = { deck: null, title: null, small: [], big: [], rider: [] };
let artTotal = 0, artDone = 0, artReady = false;
const GREY = { small: null, big: null }, SHADOW = { small: null, big: null };
function loadImg(src) {
  const img = new Image(); artTotal++;
  const done = () => { artDone++; if (artDone >= artTotal) artLoaded(); };
  img.onload = done; img.onerror = () => { img.failed = true; done(); };
  img.src = src; return img;
}
ART.deck = loadImg('assets/deck.jpg'); ART.title = loadImg('assets/title.jpg');
COLOURS.forEach(c => {
  ART.small.push(loadImg(`assets/taxi-small-${c}.png`));
  ART.big.push(loadImg(`assets/taxi-big-${c}.png`));
  ART.rider.push(loadImg(`assets/rider-${c}.png`));
});
const okImg = img => !!img && img.complete && img.naturalWidth > 0;
function artLoaded() {
  // Made once from the sprites by compositing only (no pixel reads, so file:// stays allowed):
  // one colourless body per size for covered taxis, and one soft drop shadow per size.
  try { GREY.small = greyOf(ART.small[0]); GREY.big = greyOf(ART.big[0]); } catch (e) { /* drawn fallback */ }
  try { SHADOW.small = shadowOf(ART.small[0]); SHADOW.big = shadowOf(ART.big[0]); } catch (e) { /* drawn fallback */ }
  artReady = true; bgKey = '';
}
function greyOf(img) {
  if (!okImg(img)) return null;
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'saturation'; g.fillStyle = '#808080'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#b8c2d0'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(img, 0, 0);
  return c;
}
function shadowOf(img) {
  if (!okImg(img)) return null;
  const w = img.naturalWidth, h = img.naturalHeight, pad = Math.round(w * 0.12);
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const g = s.getContext('2d'); g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const o = c.getContext('2d'); o.globalAlpha = 0.14;
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, r = pad * (k % 2 ? 0.45 : 0.85); o.drawImage(s, pad + Math.cos(a) * r, pad + Math.sin(a) * r); }
  o.globalAlpha = 0.3; o.drawImage(s, pad, pad);
  return { c, pad, w, h };
}
// Dreamina's two small AI marks (in the 1080x1920 images' pixels). Overlays that dim the screen
// draw these two corners back from the image so the marks always stay visible.
const MARKS = [[10, 10, 62, 56], [776, 1834, 300, 80]];
function keepMarks(img) {
  if (!okImg(img)) return;
  const k = W / img.naturalWidth;
  for (const [x, y, w, h] of MARKS) ctx.drawImage(img, x, y, w, h, x * k, y * k, w * k, h * k);
}

// ---- The look: palette, taxis, riders, gates ----------------------------------------------
const PAL = [ // the five colours: taxi bodies, hoodies, gate lights
  { base: '#ef4444', dark: '#8f1d1d', light: '#ff9a9a' },
  { base: '#3b8cf0', dark: '#1b4a8a', light: '#9cc8ff' },
  { base: '#3fcf7a', dark: '#177a43', light: '#a6f0c4' },
  { base: '#f7c531', dark: '#8a6400', light: '#ffe58f' },
  { base: '#a066f0', dark: '#55288f', light: '#d2b4ff' },
];
const COLOUR_NAME = ['أحمر', 'أزرق', 'أخضر', 'أصفر', 'بنفسجي'];
let gt = 0; // animation time for idle motion (title, figures and play)

// Where each sprite's ducted rotors sit (fractions of its width and height, nose up), the radius
// of a rotor as a fraction of the width, and where the nose light and tail lights go.
const SPR = {
  small: { rotors: [[0.165, 0.165], [0.835, 0.16], [0.155, 0.84], [0.845, 0.84]], r: 0.145, nose: 0.12, tail: 0.1, aspect: 0.93, fill: 0.94 },
  big: { rotors: [[0.173, 0.227], [0.822, 0.227], [0.173, 0.557], [0.822, 0.557], [0.173, 0.807], [0.822, 0.807]], r: 0.15, nose: 0.06, tail: 0.045, aspect: 0.5, fill: 0.95 },
};
// Seats as [along the facing, across] in cells from the taxi's middle: 3 in a small taxi, 6 in a shuttle.
const SEATS = {
  1: [[0.14, 0], [0, 0], [-0.14, 0]],
  2: [[0.42, -0.075], [0.42, 0.075], [0.04, -0.075], [0.04, 0.075], [-0.34, -0.075], [-0.34, 0.075]],
};
function seatLocal(len, c, k) { const S = SEATS[len], s = S[k % S.length]; return [s[0] * c, s[1] * c]; }
function taxiSize(len, c, ci) { // drawn length (along the facing) and width
  const K = len === 2 ? SPR.big : SPR.small, img = len === 2 ? ART.big[ci] : ART.small[ci];
  const h = len * c * K.fill, aspect = okImg(img) ? img.naturalWidth / img.naturalHeight : K.aspect;
  return { img, h, w: h * aspect };
}
function fallbackTaxi(w, h, col) { // only if a sprite failed to load
  ctx.fillStyle = col; rrect(-w * 0.32, -h * 0.46, w * 0.64, h * 0.92, w * 0.3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(10,20,35,0.7)'; rrect(-w * 0.18, -h * 0.3, w * 0.36, h * 0.6, w * 0.16); ctx.fill();
}
// A soft drop shadow in the taxi's own outline. Higher (alt) = further away, smaller and fainter.
function drawTaxiShadow(cx, cy, ang, len, c, alt) {
  const S = len === 2 ? SHADOW.big : SHADOW.small, { h, w } = taxiSize(len, c, 0);
  const ox = 4 + alt * 46, oy = 7 + alt * 70, ss = (1 + alt * 0.28) * (1 - alt * 0.38), a = 0.5 * (1 - alt * 0.45);
  ctx.save(); ctx.translate(cx + ox, cy + oy); ctx.rotate(ang + Math.PI / 2); ctx.scale(ss, ss); ctx.globalAlpha *= a;
  if (S) { const k = w / S.w; ctx.drawImage(S.c, -w / 2 - S.pad * k, -h / 2 - S.pad * k, S.c.width * k, S.c.height * k); }
  else { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ell(0, 0, w * 0.45, h * 0.47); ctx.fill(); }
  ctx.restore();
}
// A taxi seen from above at (cx, cy), facing ang, len cells long on cells of size c, colour ci.
// o: alt (hover height), rotor (blur strength), cover (charging cover, C2), glow, flash, seats.
function drawTaxi(cx, cy, ang, len, c, ci, fill, o) {
  o = o || {};
  const big = len === 2, K = big ? SPR.big : SPR.small, { img, h, w } = taxiSize(len, c, ci);
  const alt = o.alt || 0, sc = 1 + alt * 0.28, cover = o.cover || 0, rot = o.rotor || 0;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.scale(sc, sc);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;

// ---- Poses: where each taxi is drawn right now -----------------------------------------------
// phase: grid (on its pad), glide (hovering out and gliding to a gate), park (docked at a gate),

function taxiPose(i) {

      const u = (t - v.walk.t0) / (v.walk.t1 - v.walk.t0);
      const s = v.walk.s0 + (v.walk.path.total - v.walk.s0) * easeInOut(u);
      const cell = s <= v.walk.sExit ? gc : lerp(gc, bc, clamp((s - v.walk.sExit) / 170, 0, 1));
      const p = trainPose(v.walk.path, s, cm.len, cell, 'glide');

}
function trainPose(path, s, len, cell, phase) {

}
function parkPose(i) {

  let bx = bayX(slot);

  if (state.extra && ue < 1) bx = lerp(bayXn(slot, nGates() - 1), bx, easeInOut(clamp(ue, 0, 1)));
  return { x: bx, y: BAY_HEAD - cm.len * bc / 2, ang: Math.PI / 2, cell: bc, phase: 'park', alt: 0, rotor: 0 };
}
function liftPose(i) {
  const v = state.vc[i], L = v.leave, base = parkPose(i), u = state.t - L.t0;
  if (u < tune.spin_time) { base.rotor = clamp(u / tune.spin_time, 0.2, 1); return base; } // rotors spin up
  const r = u - tune.spin_time, dir = base.x < W / 2 ? -1 : 1;

    const k = easeInOut(r / tune.rise_time);

  }

}
function gridPose(i) {

  if (t - v.shakeT < 0.4) off = Math.sin((t - v.shakeT) * 45) * state.lv.geo.cell * 0.07 * (1 - (t - v.shakeT) / 0.4);

function takeTap() { return taps.length ? taps.shift() : null; }
function updatePlayWorld(dt) {
  const t = state.t, lv = state.lv;
  // timed effects: sounds, landing rings and downwash as scheduled moments are reached
  for (let k = state.fx.length - 1; k >= 0; k--) {
    const f = state.fx[k]; if (f.t > t) continue;
    state.fx.splice(k, 1);
    if (f.k === 'board') { sfx.board(f.seat); const [x, y] = seatWorld(f.id, f.seat); for (let j = 0; j < 5; j++) state.parts.push({ x, y, vx: (rng() - 0.5) * 120, vy: -rng() * 120, r: 3, life: 0.4, max: 0.4, col: '#eafcff' }); }
    else if (f.k === 'dock') { sfx.dock(); const p = parkPose(f.id); state.parts.push({ ring: true, x: p.x, y: p.y, r: 24, grow: 40, life: 0.5, max: 0.5, rgb: '120,235,255' }); }
    else if (f.k === 'spin') sfx.spin();
    else if (f.k === 'lift') {
      sfx.whoosh(); const p = parkPose(f.id);
      state.parts.push({ ring: true, x: p.x, y: p.y, r: 30, grow: 90, life: 0.7, max: 0.7, rgb: '170,240,255' });
      for (let j = 0; j < 12; j++) { const a = j * Math.PI / 6; state.parts.push({ x: p.x + Math.cos(a) * 30, y: p.y + Math.sin(a) * 24, vx: Math.cos(a) * 160, vy: Math.sin(a) * 120, r: 4 + rng() * 4, life: 0.5, max: 0.5, col: '#d8f6ff', a: 0.7 }); }
    }
  }
  // the line shuffles forward
  while (state.qv < lv.queue.length) { const tr = state.tr[state.qv]; if (tr.done || (tr.startT != null && t >= tr.startT)) state.qv++; else break; }
  for (let k = state.qv; k < Math.min(lv.queue.length, state.qv + Q_PER_ROW * 2 + 1); k++) {
    const tr = state.tr[k]; const [tx, ty] = slotPos(k - state.qv);
    if (tr.x == null) { const p = slotPos(k - state.qv + 1); tr.x = p[0]; tr.y = p[1]; }
    const dx = tx - tr.x, dy = ty - tr.y, e = Math.min(1, dt * tune.queue_ease);
    tr.moving = Math.abs(dx) + Math.abs(dy) > 1.5;
    tr.x += dx * e; tr.y += dy * e;
  }
  for (const tr of state.tr) if (tr.startT != null && !tr.flying && t >= tr.startT) { tr.flying = true; tr.fx0 = tr.x == null ? Q_FRONT_X : tr.x; tr.fy0 = tr.y == null ? Q_ROW1 : tr.y; }
  for (let k = state.parts.length - 1; k >= 0; k--) {
    const p = state.parts[k]; p.life -= dt; if (p.life <= 0) { state.parts.splice(k, 1); continue; }
    if (p.ring) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= 1 - dt * 2; if (!p.g) p.vy *= 1 - dt * 2;
  }
}
function moveCursor(dx, dy) {
  const lv = state.lv, S = state.S;
  state.kbd = true;
  const alive = lv.taxis.filter(c => S.mask >> c.id & 1);
  if (!alive.length) return;
  const cur = state.cursor;
  if (cur < 0 || !(S.mask >> cur & 1)) { state.cursor = (alive.find(c => canExit(lv, S, c.id)) || alive[0]).id; return; }
  const a = gridGeom(cur); let best = -1, bc = 1e9;
  for (const c of alive) {
    if (c.id === cur) continue;
    const b = gridGeom(c.id), along = (b.cx - a.cx) * dx + (b.cy - a.cy) * dy, perp = Math.abs((b.cx - a.cx) * dy - (b.cy - a.cy) * dx);
    if (along < lv.geo.cell * 0.3) continue;
    const cost = along + perp * 2; if (cost < bc) { bc = cost; best = c.id; }
  }
  if (best >= 0) state.cursor = best;
}
function taxiAt(p) {
  const lv = state.lv, S = state.S; let best = -1, bd = 1e9;
  lv.taxis.forEach(c => {
    if (!(S.mask >> c.id & 1)) return;
    const q = gridGeom(c.id), hx = q.fx - q.dx * lv.geo.cell * 0.5, hy = q.fy - q.dy * lv.geo.cell * 0.5;
    const tx = q.fx - q.dx * (q.L - lv.geo.cell * 0.5), ty = q.fy - q.dy * (q.L - lv.geo.cell * 0.5);
    const vx = hx - tx, vy = hy - ty, ll = vx * vx + vy * vy || 1;

    const d = Math.hypot(p.x - (tx + vx * u), p.y - (ty + vy * u));
    if (d < bd) { bd = d; best = c.id; }

}
function playInput() {
  if (pressed('Escape')) { scene = 'title'; return; }
  if (pressed('KeyU')) doUndo();
  if (pressed('KeyR')) { doRestart(); return; }
  if (pressed('ArrowLeft')) moveCursor(-1, 0);
  if (pressed('ArrowRight')) moveCursor(1, 0);
  if (pressed('ArrowUp')) moveCursor(0, -1);
  if (pressed('ArrowDown')) moveCursor(0, 1);
  if (pressed('Space') || pressed('Enter')) {
    if (state.cursor < 0 || !(state.S.mask >> state.cursor & 1)) moveCursor(0, 0);
    state.kbd = true;
    if (state.cursor >= 0) doTap(state.cursor);
  }
  let p;
  while ((p = takeTap())) {
    if (inRect(p, ...BTN.mute)) { setMuted(!muted); continue; }
    if (inRect(p, ...BTN.menu)) { scene = 'title'; sfx.ui(); return; }
    if (inRect(p, ...BTN.undo)) { doUndo(); continue; }
    if (inRect(p, ...BTN.restart)) { doRestart(); return; }
    const i = taxiAt(p);
    if (i >= 0) { state.kbd = false; state.cursor = i; doTap(i); }
  }
}

        if (location.protocol.startsWith('http') && inRect(p, ...TITLE_BTNS.home)) { location.href = '../../'; return; }
        if (inRect(p, ...TITLE_BTNS.stats)) { scene = 'stats'; statsClearT = -9; sfx.ui(); return; }
        if (inRect(p, ...TITLE_BTNS.start)) { startLevel(L); scene = 'play'; sfx.ui(); return; }
        for (let i = 0; i < tune.levels; i++) if (inRect(p, ...levelBtn(i)) && i + 1 <= (save.unlocked || 1)) { startLevel(i + 1); scene = 'play'; sfx.ui(); return; }
      }
    },
    draw() { drawTitle(); },
  },
  stats: {
    update() {
      if (pressed('Escape') || pressed('Enter') || pressed('Space') || pressed('KeyL') || pressed('Backspace')) { scene = 'title'; sfx.ui(); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...STATS_BTNS.back)) { scene = 'title'; sfx.ui(); return; }
        if (inRect(p, ...STATS_BTNS.clear)) {
          if (gt - statsClearT < 3) { logClear(); statsClearT = -9; sfx.undo(); events.push({ type: 'log-cleared' }); }
          else { statsClearT = gt; sfx.ui(); }
        }
      }
    },
    draw() { drawStats(); },
  },
  play: {
    update(dt) {
      state.t += dt;
      playInput();
      if (scene !== 'play') return;
      updatePlayWorld(dt);
      if (state.pending && state.t >= state.busyUntil + 0.35) {
        if (state.pending === 'win') { state.winT = state.t; finishLevel(); }
        else {
          scene = 'over'; sfx.stuck(); events.push({ type: 'stuck', level: state.level, offer: canTakeExtra() }); state.gained = 'الطيران متوقف';
          const r = logRec(state.level); r.stuck++; logSave();
        }
      }
    },
    draw() { drawPlay(); },
  },
  over: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      if (canTakeExtra()) { // C1: the offer screen; Enter, Space or E takes the free gate
        if (pressed('KeyE') || pressed('Enter') || pressed('Space')) { takeExtra(); return; }
        if (pressed('KeyR')) { doRestart(); return; }
        if (pressed('KeyU')) { doUndo(); return; }
        if (pressed('Escape')) { scene = 'title'; return; }
        let p;
        while ((p = takeTap())) {
          if (inRect(p, ...OFFER_BTNS.extra)) { takeExtra(); return; }
          if (inRect(p, ...OFFER_BTNS.undo) && state.undos > 0 && state.hist.length) { doUndo(); return; }
          if (inRect(p, ...OFFER_BTNS.restart)) { doRestart(); return; }
        }
        return;
      }
      if (pressed('KeyR') || pressed('Enter') || pressed('Space')) { doRestart(); return; }
      if (pressed('KeyU')) { doUndo(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...OVER_BTNS.restart)) { doRestart(); return; }
        if (inRect(p, ...OVER_BTNS.undo) && state.undos > 0 && state.hist.length) { doUndo(); return; }
      }
    },
    draw() { drawOver(); },
  },
  results: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      const L = state.level, next = () => { if (L >= tune.levels) scene = 'title'; else { startLevel(L + 1); scene = 'play'; } sfx.ui(); };
      if (pressed('Enter') || pressed('Space')) { next(); return; }
      if (pressed('KeyR')) { doRestart(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...RES_BTNS.next)) { next(); return; }
        if (inRect(p, ...RES_BTNS.again)) { doRestart(); return; }
      }
    },
    draw() { drawResults(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  taps = tapQueue.splice(0);
  gt += STEP;
  scenes[scene].update(STEP); hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { if (!artReady) { drawLoading(); return; } scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>

<script>
'use strict';
// Time Jam (زحمة الزمن): Sky Taxi's proven jam-and-board rules run through five eras, oldest to
// newest: camel caravans, donkeys and carts, motorbikes and tuk-tuks, taxis, then air taxis. Tap a
// vehicle whose lane is clear: it walks, drives or glides to a stop, riders in its colour board,
// and it leaves. 25 levels, each dealt only after the solver proves it, each harder than the last.
// The art is Dreamina's (assets/provenance.yaml); code draws the lots, stops, covers, shadows,
// motion, dust and exhaust, and every HUD icon.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.gates is CONFIG.gates.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: portrait phone

const TITLE = 'زحمة الزمن · Time Jam';
const CONTROLS = [
  'اضغط مركبة طريقها مفتوح لتذهب إلى موقف',
  'يركب المسافرون المركبة التي بلون ملابسهم',
  'الأسهم: اختيار · مسافة: انطلاق',
  'U تراجع · R إعادة · E موقف إضافي',
  'L إحصائياتي · M صوت · Esc رجوع',

const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const screenCtx = canvas.getContext('2d');
let ctx = screenCtx;
let bgCanvas = null, bgKey = '';
function fit() { // fills the window at any size and pixel ratio

  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  screenCtx.setTransform(r, 0, 0, r, 0, 0); screenCtx.imageSmoothingEnabled = !PIXEL;
  bgKey = '';
}
addEventListener('resize', fit); fit();
const AR = /[؀-ۿ]/;
function text(s, x, y, size, c, align = 'center', weight = 700) {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.direction = AR.test(s) ? 'rtl' : 'ltr';
  ctx.fillText(s, x, y); ctx.direction = 'ltr';
}
function textOutline(s, x, y, size, c, outline, lw) {
  ctx.font = `800 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.direction = AR.test(s) ? 'rtl' : 'ltr'; ctx.lineJoin = 'round';
  ctx.strokeStyle = outline; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y); ctx.direction = 'ltr';
}

// ---- Input: keys by position (event.code), OS key repeat ignored; taps queued for the step --
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());
const tapQueue = []; let taps = [];
let hoverP = null; // a mouse pointer over the lot shows that vehicle's lane (desktop only)
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); startAudio();
  tapQueue.push(toLogical(e));
});
canvas.addEventListener('pointermove', e => { e.preventDefault(); hoverP = e.pointerType === 'mouse' ? toLogical(e) : null; });
canvas.addEventListener('pointerleave', () => { hoverP = null; });
['pointerup', 'pointercancel'].forEach(n => canvas.addEventListener(n, e => e.preventDefault()));
canvas.addEventListener('contextmenu', e => e.preventDefault());
function inRect(p, x, y, w, h) { return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const AC = window.GAME_AUDIO ? null : (window.AudioContext || window.webkitAudioContext);
    if (!window.GAME_AUDIO && !AC) return;
    const ac = window.GAME_AUDIO || new AC(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
    loadSamples();
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
// Recorded sounds (assets/sfx-data.js, CC0): decoded once when audio starts; until then, or if decoding
// fails, the synthesized stand-ins below play instead.
const SAMPLES = {};
function loadSamples() {
  const data = window.SFX_DATA; if (!data || !audio.ac.decodeAudioData) return;
  for (const k in data) {
    SAMPLES[k] = [];
    data[k].forEach((b64, n) => {
      try {
        const bin = atob(b64), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        const done = ab => { SAMPLES[k][n] = ab; }, p = audio.ac.decodeAudioData(buf.buffer, done, () => {});
        if (p && p.catch) p.catch(() => {});

}
const hasSample = k => SAMPLES[k] && SAMPLES[k].some(Boolean);
/** Play one take of a recorded sound: n picks the take, rate the pitch and speed, pan left (-1) to right (1). */
function play(k, n, { rate = 1, vol = 1, pan = 0, delay = 0, dur = 0 } = {}) {
  if (!audio || muted) return false;
  const takes = SAMPLES[k] && SAMPLES[k].filter(Boolean); if (!takes || !takes.length) return false;
  try {
    const t = audio.ac.currentTime + delay, src = audio.ac.createBufferSource(), g = audio.ac.createGain();
    src.buffer = takes[Math.abs(n | 0) % takes.length]; src.playbackRate.value = rate; g.gain.setValueAtTime(vol, t);
    if (dur > 0) { g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t + dur); } // cut short with a soft fade
    src.connect(g).connect(outAt(t, pan)); src.start(t); if (dur > 0) src.stop(t + dur + 0.02);
    return true;
  } catch (err) { return false; /* a stand-in audio context */ }
}
let voiceLast = -9, voiceN = 0;
/** The animal speaks, not more often than every voice_gap seconds: camels groan; in the donkey era the small
 *  donkeys bray the full "hee-haw, hee-haw" and the cart's animal whinnies like a horse. */
function voice(e, big, pan, vol = 1) {
  if (!audio || muted || audio.ac.currentTime - voiceLast < tune.voice_gap) return false;
  const n = voiceN++, k = e === 0 ? 'camel' : big ? 'horse' : 'donkey';
  const rate = k === 'donkey' ? 0.97 + hash(n, 41) * 0.08 : (big ? 0.9 : 1.04) * (0.95 + hash(n, 41) * 0.1);
  if (!play(k, n, { rate, vol: tune.voice_vol * vol, pan, dur: k === 'camel' ? 1.5 : k === 'horse' ? 1.8 : 2.4 })) return false;
  voiceLast = audio.ac.currentTime; return true;
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m || Ads.busy ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
// A pitch glide (rotors, engines) and a filtered noise rush (whoosh, dust), both made here.
function sweep(f0, f1, dur, type, vol, delay = 0) {
  if (!audio || muted) return;
  try {
    const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* a stand-in audio context may not have ramps */ }
}
let noiseBuf = null;
function rush(dur, f0, f1, vol, delay = 0) {
  if (!audio || muted) return;
  try {
    const ac = audio.ac;
    const t = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(audio.out); src.start(t); src.stop(t + dur + 0.05);
  } catch (e) { /* a stand-in audio context may not make noise */ }
}
// Footfalls, made here: a filtered noise grain (sand crunch, hoof click) and a short pitched body
// (the padded thud of a camel's foot, the hollow "tok" of a hoof on stone), panned to where the animal is.
function noise() {
  const ac = audio.ac;
  if (!noiseBuf) {
    const n = Math.floor(ac.sampleRate * 1.2); noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let k = 0; k < n; k++) d[k] = hash(k, 77) * 2 - 1;
  }

}

  return audio.out;
}

  const ac = audio.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noise(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(f).connect(g).connect(outAt(t, pan)); src.start(t, off % 1); src.stop(t + dur + 0.03);

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(outAt(t, pan)); o.start(t); o.stop(t + dur + 0.03);

let stepN = 0, stepLast = -1;
const sfx = { // each era sounds like its vehicles: hooves and a bell, engines and horns, rotors
  /** One footfall of a walking animal: era 0 camels on sand, era 1 donkeys on stone (with cart wheels for the big ones). */
  step(e, big, x) {
    if (!audio || muted) return;
    try {
      const ac = audio.ac, now = ac.currentTime;

      const r = k => hash(n, k), lr = n % 2 ? 1 : 0.9; // every foot a little different; left and right not the same

        play('sand', n * 3 + (r(1) * 5 | 0), { rate: (big ? 0.72 : 0.84) * (0.94 + r(2) * 0.12), vol: 0.75 * v, pan });
        if (big && n % 4 === 0) body(now + 0.02, 2093 * (1 + r(6) * 0.02), 2080, 0.35, 0.03 * v, pan, 'triangle'); // the howdah's little bell
        return;
      }
      if (e === 1 && hasSample('hoof')) { // real hooves on hard ground: fore and hind feet a beat apart make the clip-clop
        for (const [d, k] of [[0, 1], [0.085 + r(7) * 0.025, 0.9]]) play('hoof', n * 2 + (r(8 + d) * 6 | 0), { rate: 1.12 * k * lr * (0.95 + r(9) * 0.1), vol: 0.5 * v, pan, delay: d });
        if (big && n % 3 === 0) play('creak', n, { rate: 0.9 + r(12) * 0.25, vol: 0.28 * v, pan, delay: 0.05 }); // the cart's wheels and shafts
        return;
      }
      if (e === 0) { // a camel's soft padded foot sinking into sand, then the sand settling
        body(now, 110 * lr * (0.92 + r(1) * 0.16), 48, 0.13, 0.32 * v, pan);
        grain(now, 0.16, 'bandpass', 900 + r(2) * 500, 0.8, 0.16 * v, pan, r(3));
        grain(now + 0.03, 0.12, 'highpass', 2600 + r(4) * 1200, 0.5, 0.05 * v, pan, r(5));
        if (big && n % 4 === 0) body(now + 0.02, 2093 * (1 + r(6) * 0.02), 2080, 0.35, 0.035 * v, pan, 'triangle'); // the howdah's little bell
      } else { // a donkey's hoof on stone: fore and hind feet a beat apart make the clip-clop
        for (const [d, k] of [[0, 1], [0.075 + r(7) * 0.02, 0.84]]) {
          body(now + d, 760 * k * lr * (0.95 + r(8) * 0.1), 430 * k, 0.07, 0.2 * v, pan, 'triangle');
          grain(now + d, 0.035, 'bandpass', 3200 + r(9) * 900, 3.5, 0.18 * v, pan, r(10 + d));
        }
        if (big) { grain(now, 0.3, 'lowpass', 220, 0.7, 0.12 * v, pan, r(11)); if (n % 3 === 0) body(now + 0.12, 180, 120, 0.06, 0.08 * v, pan, 'triangle'); } // wheels on cobbles
      }

  },
  /** A vehicle is sent: the animal grunts or brays, the engine starts, the rotors spin up. */
  tap(e, big = false, x = W / 2) {

    if (m === 'walk') { sfx.step(e, big, x); if (!voice(e, big, pan)) tone(e ? 880 : 1175, 0.12, 'sine', 0.05, 0.04); return; }
    if (m === 'drive') {
      if (e === 2 && play('moto', n, { rate: big ? 0.9 : 1, vol: 0.5, pan, dur: 1.8 })) return;  // a motorbike engine starting and running, the tuk-tuk a bit deeper
      if (e === 3 && play('start', n, { rate: big ? 0.88 : 1, vol: 0.55, pan, dur: 1.5 })) return;    // a car starter and the engine catching

  },
  blocked() { tone(140, 0.12, 'square', 0.1); tone(104, 0.2, 'square', 0.09, 0.09); },
  dock(e) { // arriving at a stop: a soft clop and bell, a brake hiss and chime, a landing chime
    const m = ERAS[e].move;
    if (m === 'walk') { tone(1046, 0.25, 'sine', 0.09, 0.05); tone(1568, 0.3, 'sine', 0.04, 0.09); }
    else if (m === 'drive') { if (!(e === 3 && play('door', 0, { rate: 0.95, vol: 0.5, delay: 0.15 }))) rush(0.22, 2400, 900, 0.1); tone(784, 0.12, 'sine', 0.08, 0.08); }
    else { tone(784, 0.09, 'sine', 0.18); tone(1175, 0.16, 'sine', 0.14, 0.07); }
  },
  /** A rider pays the fare: a bright coin clink (two metal partials and a tiny ring), rising seat by seat. */
  board(k) {
    if (!audio || muted) return;
    try {
      const t = audio.ac.currentTime, p = Math.pow(1.06, Math.min(k, 10)), v = tune.coin_vol;
      if (hasSample('clink')) { play('clink', k, { rate: 1.9 * p, vol: 0.5 * v }); play('clink', k + 2, { rate: 2.3 * p, vol: 0.25 * v, delay: 0.06 }); return; }

      body(t + 0.055, 3136 * p, 3120 * p, 0.28, 0.09 * v, 0); body(t + 0.055, 4699 * p, 4690 * p, 0.2, 0.04 * v, 0); // it lands on the pile

  whoosh() { if (!play('liftoff', 0, { rate: 1.1, vol: 0.5 })) rush(0.9, 300, 2600, 0.5); sweep(200, 900, 0.7, 'triangle', 0.04); },

  });

    if (inRect(p, ...BTN.mute)) { setMuted(!muted); continue; }
    if (inRect(p, ...BTN.menu)) { openEra(eraNow()); return; }
    if (inRect(p, ...BTN.undo)) { doUndo(); continue; }
    if (inRect(p, ...BTN.restart)) { doRestart(); return; }
    const i = taxiAt(p);
    if (i >= 0) { state.kbd = false; state.cursor = i; doTap(i); continue; }
    if (garageAt(p)) { toast('تخرج المركبة حين تفرغ الخانتان أمام المرآب'); sfx.blocked(); }
  }
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { drawFigures(); },
  },
  title: {
    update() {
      if (pressed('Enter') || pressed('Space')) { playLevel(save.done ? 1 : nextLevel()); return; }
      if (pressed('KeyL')) { scene = 'stats'; statsEra = eraOf(nextLevel()); statsClearT = -9; sfx.ui(); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...TITLE_BTNS.mute)) { setMuted(!muted); continue; }
        if (location.protocol.startsWith('http') && inRect(p, ...TITLE_BTNS.home)) { location.href = '../../'; return; }
        if (inRect(p, ...TITLE_BTNS.stats)) { scene = 'stats'; statsEra = eraOf(nextLevel()); statsClearT = -9; sfx.ui(); return; }
        if (inRect(p, ...TITLE_BTNS.start)) { playLevel(save.done ? 1 : nextLevel()); return; }
        for (let e = 0; e < ERAS.length; e++) if (inRect(p, ...eraRow(e))) {
          if (e <= eraOf(nextLevel())) openEra(e); else { sfx.blocked(); events.push({ type: 'era-locked', era: e + 1 }); }
          return;
        }
      }
    },
    draw() { drawTitle(); },
  },
  era: {
    update() {
      const e = uiEra, open = k => e * ERA_LEVELS + k + 1 <= (save.unlocked || 1);
      if (pressed('Escape') || pressed('Backspace')) { scene = 'title'; sfx.ui(); return; }
      if (pressed('ArrowRight')) eraSel = Math.max(0, eraSel - 1); // right to left
      if (pressed('ArrowLeft')) eraSel = Math.min(ERA_LEVELS - 1, eraSel + 1);
      if ((pressed('Enter') || pressed('Space')) && LOAD[e].ready && open(eraSel)) { playLevel(e * ERA_LEVELS + eraSel + 1); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...ERA_BTNS.back)) { scene = 'title'; sfx.ui(); return; }
        if (inRect(p, ...ERA_BTNS.mute)) { setMuted(!muted); continue; }
        if (inRect(p, ...ERA_BTNS.play) && LOAD[e].ready && open(eraSel)) { playLevel(e * ERA_LEVELS + eraSel + 1); return; }
        for (let k = 0; k < ERA_LEVELS; k++) if (inRect(p, ...eraTile(k))) {
          if (open(k) && LOAD[e].ready) { eraSel = k; playLevel(e * ERA_LEVELS + k + 1); return; }
          if (!open(k)) sfx.blocked();
        }
      }
    },
    draw() { drawEraScreen(); },
  },
  unlock: {
    update(dt) {
      unlockT += dt;
      const go = () => { startLevel(unlockLevel); scene = 'play'; sfx.ui(); };
      if (!LOAD[unlockEra].ready) { taps = []; return; }
      if (unlockT > tune.unlock_time && unlockT - STEP <= tune.unlock_time) dealLevel(unlockLevel); // dealt once the vehicle has arrived
      if (unlockT > 0.6 && (pressed('Enter') || pressed('Space'))) { go(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) if (unlockT > 0.6 && inRect(p, ...UNLOCK_BTN)) { go(); return; }
    },
    draw() { drawUnlock(); },
  },
  stats: {
    update() {
      if (pressed('Escape') || pressed('Enter') || pressed('Space') || pressed('KeyL') || pressed('Backspace')) { scene = 'title'; sfx.ui(); return; }
      if (pressed('ArrowRight')) statsEra = Math.max(0, statsEra - 1);
      if (pressed('ArrowLeft')) statsEra = Math.min(ERAS.length - 1, statsEra + 1);
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...STATS_BTNS.back)) { scene = 'title'; sfx.ui(); return; }
        for (let k = 0; k < ERAS.length; k++) if (inRect(p, ...statTab(k))) { statsEra = k; sfx.ui(); }
        if (inRect(p, ...STATS_BTNS.clear)) {
          if (gt - statsClearT < 3) { logClear(); statsClearT = -9; sfx.undo(); events.push({ type: 'log-cleared' }); }
          else { statsClearT = gt; sfx.ui(); }
        }
      }
    },
    draw() { drawStats(); },
  },
  play: {
    update(dt) {
      state.t += dt;
      playInput();
      if (scene !== 'play') return;
      updatePlayWorld(dt);
      if (state.pending && state.t >= state.busyUntil + 0.35) {
        if (state.pending === 'win') { state.winT = state.t; finishLevel(); }
        else {
          scene = 'over'; sfx.stuck(); events.push({ type: 'stuck', level: state.level, offer: canTakeExtra() }); state.gained = 'عالق';
          FAILS[state.level] = (FAILS[state.level] || 0) + 1;
          const r = logRec(state.level); r.stuck++; logSave();
        }
      }
    },
    draw() { drawPlay(); },
  },
  over: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      if (canTakeExtra()) { // the offer screen; Enter, Space or E takes the free stop
        if (pressed('KeyE') || pressed('Enter') || pressed('Space')) { askExtra(); return; }
        if (pressed('KeyR')) { doRestart(); return; }
        if (pressed('KeyU')) { doUndo(); return; }
        if (pressed('Escape')) { openEra(eraNow()); return; }
        let p;
        while ((p = takeTap())) {
          if (inRect(p, ...OFFER_BTNS.extra)) { askExtra(); return; }
          if (undoTap(p, OFFER_BTNS.undo)) return;
          if (inRect(p, ...OFFER_BTNS.restart)) { doRestart(); return; }
        }
        return;
      }
      if (pressed('KeyR') || pressed('Enter') || pressed('Space')) { doRestart(); return; }
      if (pressed('KeyU')) { doUndo(); return; }
      if (pressed('KeyN') && canSkip()) { askSkip(); return; }
      if (pressed('Escape')) { openEra(eraNow()); return; }
      let p; const B = overBtns();
      while ((p = takeTap())) {
        if (inRect(p, ...B.restart)) { doRestart(); return; }
        if (undoTap(p, B.undo)) return;
        if (B.skip && inRect(p, ...B.skip)) { askSkip(); return; }
      }
    },
    draw() { drawOver(); },
  },
  results: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      if (!state.prefetched && state.t - state.winT > 1.1 && state.level < tune.levels) { state.prefetched = true; dealLevel(state.level + 1); } // dealt now, while the stars rest
      const L = state.level, go = () => {
        if (L >= tune.levels) { scene = 'title'; sfx.ui(); }
        else if (eraOf(L + 1) !== eraOf(L)) openUnlock(eraOf(L + 1), L + 1);
        else { startLevel(L + 1); scene = 'play'; sfx.ui(); }
      };
      // a short ad between levels: only here, after a win, and only when the rules in ads.js say it is due
      const next = () => { const lv = state.lv; if (L < tune.levels && Ads.interstitialDue(L, eraOf(L + 1) !== eraOf(L))) Ads.interstitial('between_levels').then(() => { if (state.lv === lv && scene === 'results') go(); }); else go(); };
      if (pressed('Enter') || pressed('Space')) { next(); return; }
      if (pressed('KeyR')) { doRestart(); return; }
      if (pressed('Escape')) { openEra(eraNow()); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...RES_BTNS.next)) { next(); return; }
        if (inRect(p, ...RES_BTNS.again)) { doRestart(); return; }
      }
    },
    draw() { drawResults(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
// What the current scene still waits for from the loader (null: nothing). The era screen and the
// "انتقلت إلى" scene draw their own waiting state.
function waitingFor() {
  if (!titleImg.done) return -1;
  if (scene === 'figures') { const e = LOAD.findIndex(g => !g.ready); if (e >= 0) { ERAS.forEach((_, k) => requestEra(k)); return -2; } return null; }
  if (scene === 'title' || scene === 'stats') return LOAD[bootEra].ready ? null : bootEra;
  if (scene === 'play' || scene === 'over' || scene === 'results') { const e = eraOf(state.level); requestEra(e); return LOAD[e].ready ? null : e; }
  return null;
}
let adUp = false;
function step() {
  if (Ads.busy !== adUp) { adUp = Ads.busy; if (audio) audio.out.gain.value = muted || adUp ? 0 : tune.volume; } // an ad owns the sound while it plays
  if (adUp) { tapQueue.length = 0; hit.clear(); return; } // and the game waits: no time passes, no input leaks through
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  taps = tapQueue.splice(0);
  gt += STEP;
  if (waitingFor() === null) scenes[scene].update(STEP);
  hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1, pageBg = '';
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  viewEra = scene === 'era' ? uiEra : scene === 'unlock' ? unlockEra : (scene === 'play' || scene === 'over' || scene === 'results') && state ? eraOf(state.level) : -1;
  const bg = viewEra >= 0 ? ERAS[viewEra].base : '#160f24'; // the letterbox bars take the screen's colour
  if (bg !== pageBg) { pageBg = bg; document.documentElement.style.background = bg; document.body.style.background = bg; }
  const w = waitingFor();
  if (w !== null) { drawLoading(w); return; }
  scenes[scene].draw();
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

// The title art and the era about to be played load first; the other eras follow in order.
{
  const want = Math.floor(Number(params.get('level')) || 0);
  bootEra = eraOf(want >= 1 ? Math.min(want, tune.levels) : nextLevel());
  loadQueue = ERAS.map((_, k) => (bootEra + 1 + k) % ERAS.length).filter(k => k !== bootEra);
  titleImg = getImg('title.jpg');
  requestEra(bootEra);
}
reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
if (scene === 'era') uiEra = eraOf(state.level);
if (scene === 'unlock') { unlockEra = eraOf(state.level); unlockLevel = state.level; requestEra(unlockEra); }
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

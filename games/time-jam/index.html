// ---- Saved progress and personal bests (the game works without storage) -------------------
// stars: best stars per level; unlocked: the highest level open; seen: eras whose "انتقلت إلى" scene ran.
const SAVE_KEY = 'time-jam-save-v1' + (OPEN_ALL ? ':open' : '');
let save = { stars: [], unlocked: 1, seen: 1 };
try {
  let s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (!s && OPEN_ALL) s = JSON.parse(localStorage.getItem('time-jam-save-v1')); // the review save starts as a copy of the real one
  if (s && Array.isArray(s.stars)) save = Object.assign(save, s);
} catch (e) { /* no storage */ }
// the review link jumps about, so it keeps the eras whose "انتقلت إلى" scene has run one by one (seen only counts up)
if (OPEN_ALL && !Array.isArray(save.saw)) save.saw = Array.from({ length: save.seen || 1 }, (_, k) => k);
// A save from the 25-level game: whoever finished level 25 goes straight on to season 2.
function migrateSave() {
  const top = CONFIG.levels.value; let last = 0;
  for (let k = 0; k < save.stars.length; k++) if (save.stars[k]) last = k + 1;
  if (last >= (save.unlocked || 1) && last < top) save.unlocked = last + 1;
  save.done = (save.stars[top - 1] || 0) > 0;
}
migrateSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* no storage */ } }
function totalStars() { return save.stars.reduce((a, b) => a + (b || 0), 0); }
function seasonStars(s) { let n = 0; for (let k = 0; k < SEASON_LEVELS; k++) n += save.stars[s * SEASON_LEVELS + k] || 0; return n; }
function eraStars(e, s = viewSeason) { let n = 0; for (let k = 0; k < ERA_LEVELS; k++) n += save.stars[lvAt(s, e, k) - 1] || 0; return n; }

// ---- Local play log: honest per-level numbers for the owner's playtests, on this device only --
// An attempt counts from its first vehicle tap; firstTryWin is 1 when the very first attempt was won.

try { const s = JSON.parse(localStorage.getItem(LOG_KEY)); if (s && s.levels && typeof s.levels === 'object') playLog = s; } catch (e) { /* no storage */ }
function logRec(L) {
  const k = String(L);
  return playLog.levels[k] || (playLog.levels[k] = { attempts: 0, wins: 0, stuck: 0, firstTryWin: null, bestTime: null, undos: 0, extraGates: 0 });
}
function logSave() { try { localStorage.setItem(LOG_KEY, JSON.stringify(playLog)); } catch (e) { /* no storage */ } }

function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }

// ---- Small drawing helpers ----------------------------------------------------------------
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// The series: a chapter is one era of one season; a level's era is its season's world and its chapter's place in it.
const SEASON_LEVELS = ERA_LEVELS * EPS;
const chapOf = L => Math.floor((Math.max(1, L) - 1) / ERA_LEVELS);          // 0, 1, 2 ... across seasons
const seasonOf = L => Math.floor((Math.max(1, L) - 1) / SEASON_LEVELS);
const placeOf = L => chapOf(L) % EPS;                                       // its era's place in its season, 0..4
const worldOf = s => ((s % WORLDS.length) + WORLDS.length) % WORLDS.length; // the world a season plays
const eraAt = (s, k) => worldOf(s) * EPS + k;                               // season, place -> the era (ERAS index)
const eraOf = L => eraAt(seasonOf(L), placeOf(L));
const lvAt = (s, k, i) => (s * EPS + k) * ERA_LEVELS + i + 1;               // season, place, place in the era -> level
const worldNow = () => WORLDS[Math.floor((state ? eraOf(state.level) : 0) / EPS)];
const stopW = k => worldNow().stop[k];                                      // "موقف" on land, "رصيف" at sea: one, many, object

// ---- Scenes ---------------------------------------------------------------------------------
function takeTap() { return taps.length ? taps.shift() : null; }
function updatePlayWorld(dt) {
  const t = state.t, lv = state.lv, e = eraNow(), E = ERAS[e];
  // timed effects: sounds, pops, rings, sparks, dust and downwash as scheduled moments are reached
  for (let k = state.fx.length - 1; k >= 0; k--) {
    const f = state.fx[k]; if (f.t > t) continue;
    state.fx.splice(k, 1);
    const v = state.vc[f.id];
    if (f.k === 'board') { // a rider lands in a seat: the seat pops, "+1" floats up, the vehicle squashes
      sfx.board(f.seat); const sp = seatWorld(f.id, f.seat), x = sp[0], y = sp[1];
      v.popSeat = f.seat; v.popT = t; v.squashT = t; state.lastBoardT = t;
      state.anger = Math.max(0, state.anger - tune.calm_per_board);
      fxs(FX.spark, pick(FX.spark.twinkle), x, y, 0, -20, 22, 40, 0.45, 0.95, rng() * 6.3, 2, false, true);
      floater('+1', x, y - 24, 28, '#ffffff', 0.7, 46);
      if (f.full) { // the vehicle is full: a flash, a chord, sparks; full ones close together build a combo
        v.fullT = t; sfx.full();
        const p = parkPose(f.id);
        fxs(FX.spark, pick(FX.spark.flare), p.x, p.y, 0, 0, p.cell * 0.6, p.cell * 1.6, 0.55, 0.9, rng() * 6.3, 1.5, false, true);
        for (let j = 0; j < 9; j++) { const a = j * Math.PI * 2 / 9 + rng() * 0.4, sp = 170 + rng() * 130;
          fxs(FX.spark, pick(FX.spark.star), p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp * 0.8 - 40, 26 + rng() * 14, 8, 0.7 + rng() * 0.25, 1, rng() * 6.3, (rng() - 0.5) * 9, false); }
        state.combo = t - state.lastFullT <= tune.combo_window ? state.combo + 1 : 1; state.lastFullT = t;
        if (state.combo >= 2) {
          const w = COMBO_WORDS[Math.min(COMBO_WORDS.length - 1, state.combo - 2)];
          state.floats.push({ text: w, x: W / 2, y: COMBO_Y, size: 56, col: '#ffd34d', t0: t, life: 1.1, rise: 70, big: true });
          sfx.combo(state.combo); events.push({ type: 'combo', n: state.combo });
        }
      }
    }
    else if (f.k === 'dock') { // arrival: a dock bump, a ring in the era's light; riders in its colour cheer
      sfx.dock(e); v.arriveT = t; const p = parkPose(f.id);
      { const col = lv.taxis[f.id].colour; let n = 0;
        for (let k = state.qv; k < Math.min(lv.queue.length, state.qv + Q_VIS) && n < tune.cheer_riders; k++) { const tr = state.tr[k]; if (tr.col === col && tr.startT == null) { tr.cheerT = t + 0.05 + n * 0.07; n++; } } }
      spawn(2, p.x, p.y, 0, 0, 30, 0.5, E.accent, 0, true, 50);
      for (let j = 0; j < 5; j++) { const a = j * Math.PI * 2 / 5 + rng(); puff(p.x + Math.cos(a) * p.cell * 0.45, p.y + Math.sin(a) * p.cell * 0.35, 1.3, E.lot.puff, a); }
    }
    else if (f.k === 'depart-lot') events.push({ type: 'trip', id: f.id });
    else if (f.k === 'roll') sfx.roll();
    else if (f.k === 'spin') sfx.spin();
    else if (f.k === 'go') { const p = parkPose(f.id); sfx.go(e, big3(lv.taxis[f.id].len), p.x); for (let j = 0; j < 4; j++) puff(p.x - v.dir * (lv.taxis[f.id].len * p.cell * 0.4 + j * 14), p.y + (j - 1.5) * 12, 1.4, E.lot.puff, v.dir > 0 ? 0 : Math.PI); }
    else if (f.k === 'lift') {
      sfx.whoosh(); const p = parkPose(f.id);
      fxs(FX.wash, pick(FX.wash.ring), p.x, p.y, 0, 0, p.cell * 0.6, p.cell * 2.2, 0.8, 0.85, rng() * 6.3, 0, true, true);
      fxs(FX.wash, pick(FX.wash.swirl), p.x, p.y, 0, 0, p.cell * 0.8, p.cell * 1.6, 0.9, 0.7, rng() * 6.3, 6, true, true);
    }
  }
  // hoofprints: each step of a walking animal leaves a print in the ground that fades after a few seconds
  if (E.move === 'walk') for (let i = 0; i < lv.taxis.length; i++) {
    const v = state.vc[i], walking = (v.trip && t >= v.trip.t0 && t < v.trip.t1) || (v.leave && v.leave.kind === 'ground' && t >= v.leave.go && t < v.leave.mv.t1);
    if (!walking) continue;
    const p = taxiPose(i); if (!p || p.gait == null) continue;
    const step = Math.floor(p.gait / tune.stride); if (v.lastStep === step) continue;
    const first = v.lastStep == null; v.lastStep = step; if (first) continue;
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang), sd = step % 2 ? 1 : -1, c = p.cell, back = lv.taxis[i].len * c * 0.3, sx = -sa * c * 0.13 * sd, sy = ca * c * 0.13 * sd;
    for (const k of [0, 1]) { const bk = back + k * c * 0.5; spawn(1, p.x - ca * bk + sx, p.y - sa * bk + sy, 0, 0, Math.max(2.5, c * 0.045), tune.print_life, E.lot.print, 0, true, 0, 0.5); }
    if (p.x > -40 && p.x < W + 40) sfx.step(e, big3(lv.taxis[i].len), p.x);
  }
  // era effects behind moving vehicles: sand puffs for animals, exhaust for engines, rotor wash for air taxis
  for (let i = 0; i < lv.taxis.length; i++) {
    const v = state.vc[i], moving = (v.trip && t >= v.trip.t0 && t < v.trip.t1) || (v.leave && v.leave.kind === 'ground' && t >= v.leave.go && t < v.leave.mv.t1);
    const idle = E.move === 'drive' && !v.trip && !v.gone && !v.parked && t >= v.rollT && canExit(lv, state.S, i) && !state.pending;
    if (!moving && !idle) continue;
    const period = moving ? (E.move === 'fly' ? 0.1 : E.move === 'walk' ? 0.09 : E.move === 'sail' ? 0.11 : E.move === 'sled' ? 0.1 : 0.07) : 1.3, ph = moving ? 0 : hash(i, 5) * period;
    if (Math.floor((t + ph) / period) === Math.floor((t - dt + ph) / period)) continue;
    const p = taxiPose(i); if (!p) continue;
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang), back = lv.taxis[i].len * p.cell * 0.5, side = p.cell * 0.28;
    const bx = p.x - ca * back, by = p.y - sa * back;
    const c = p.cell, fx = tune.fx, jit = () => (rng() - 0.5);
    if (E.move === 'fly') { // rotor downwash: a spinning swirl of air under the taxi, now and then a glowing ring
      fxs(FX.wash, pick(FX.wash.swirl), p.x + 4, p.y + 8, -ca * 40, -sa * 40, c * 0.5, c * 0.9 * fx, 0.55, 0.5, rng() * 6.3, 5, true, true);
      if (rng() < 0.18) fxs(FX.wash, pick(FX.wash.ring), p.x + 4, p.y + 8, 0, 0, c * 0.4, c * 1.2 * fx, 0.6, 0.55, rng() * 6.3, 0, true, true);

    }
    if (E.move === 'sail') { // foam curls off the stern on both sides and is left behind on the water
      if (!moving) continue;
      for (const sd of [-1, 1]) fxs(FX.wash, pick(FX.wash.swirl), bx - sa * side * sd + jit() * 8, by + ca * side * sd + jit() * 8, -ca * 26 + jit() * 16, -sa * 26 + jit() * 16,

        c * 0.24 * fx, c * 0.4 * fx, 0.75, 0.8, p.ang - FX.dust.wisp + jit() * 0.5, jit() * 0.6, true);
      if ((E.snd === 'engine' || E.snd === 'ski') && rng() < 0.45) fxs(FX.smoke, pick(FX.smoke.light), bx, by, -ca * 50 + jit() * 20, -sa * 50 - 16 + jit() * 14, c * 0.16 * fx, c * 0.4 * fx, 0.8, 0.5, p.ang - FX.smoke.wisp + jit() * 0.5, jit() * 0.6, false);

      for (const sd of [-1, 1]) fxs(FX.dust, pick(FX.dust.frames), bx - sa * side * sd + jit() * 12, by + ca * side * sd + jit() * 12, -ca * 45 + jit() * 30, -sa * 45 + jit() * 30,

function moveCursor(dx, dy) {

function taxiAt(p) { // the vehicle on the lot under a tap: its body, a cell wide (>= 76 px)
  const lv = state.lv, S = state.S; let best = -1, bd = 1e9;
  lv.taxis.forEach(c => {
    if (!onLot(lv, S.mask, c.id) || state.vc[c.id].trip) return;

function playInput() {

    while ((p = takeTap())) go = true;
    if (go && state.t > 0.3) { state.warn = 0; state.t = 0; state.bannerT = 0; events.push({ type: 'warn-done', level: state.level }); }
    return;

  if (pressed('KeyU')) doUndo();
  if (pressed('KeyR')) { doRestart(); return; }
  if (pressed('KeyH')) askHint();
  if (pressed('ArrowLeft')) moveCursor(-1, 0);
  if (pressed('ArrowRight')) moveCursor(1, 0);
  if (pressed('ArrowUp')) moveCursor(0, -1);
  if (pressed('ArrowDown')) moveCursor(0, 1);

    if (inRect(p, ...BTN.undo)) { doUndo(); continue; }

function stepSeason(d) { const v = clamp(viewSeason + d, 0, nSeasons() - 1); if (v === viewSeason) return; viewSeason = v; listT = clock.now(); queueWorld(eraAt(v, 0), true); onLoaded(); sfx.ui(); events.push({ type: 'season-view', season: v + 1 }); }
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { drawFigures(); },
  },
  title: {
    update() {
      if (pressed('Enter') || pressed('Space')) { playLevel(save.done ? 1 : nextLevel()); return; }
      if (pressed('KeyL')) { scene = 'stats'; statsEra = placeOf(nextLevel()); viewSeason = seasonOf(nextLevel()); statsClearT = -9; sfx.ui(); return; }
      if (pressed('ArrowRight')) stepSeason(-1); // right to left: the earlier season is on the right
      if (pressed('ArrowLeft')) stepSeason(1);
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...TITLE_BTNS.mute)) { setMuted(!muted); continue; }
        if (location.protocol.startsWith('http') && inRect(p, ...TITLE_BTNS.home)) { location.href = '../../'; return; }
        if (inRect(p, ...TITLE_BTNS.stats)) { scene = 'stats'; statsEra = placeOf(nextLevel()); viewSeason = seasonOf(nextLevel()); statsClearT = -9; sfx.ui(); return; }
        if (inRect(p, ...TITLE_BTNS.start)) { playLevel(save.done ? 1 : nextLevel()); return; }
        if (inRect(p, ...SEASON_BTNS.prev)) { stepSeason(-1); continue; }
        if (inRect(p, ...SEASON_BTNS.next)) { stepSeason(1); continue; }
        for (let e = 0; e < EPS; e++) if (inRect(p, ...eraRow(e))) {
          if (viewSeason * EPS + e <= chapOf(OPEN_ALL ? tune.levels : nextLevel())) openEra(eraAt(viewSeason, e), viewSeason); else { sfx.blocked(); events.push({ type: 'era-locked', era: e + 1, season: viewSeason + 1 }); }
          return;

    draw() { drawTitle(); },
  },
  era: {
    update() {
      const e = uiEra, pl = e % EPS, open = k => lvAt(uiSeason, pl, k) <= reach();

      if (pressed('ArrowRight')) eraSel = Math.max(0, eraSel - 1); // right to left
      if (pressed('ArrowLeft')) eraSel = Math.min(ERA_LEVELS - 1, eraSel + 1);
      if ((pressed('Enter') || pressed('Space')) && LOAD[e].ready && open(eraSel)) { playLevel(lvAt(uiSeason, pl, eraSel)); return; }

      while ((p = takeTap())) {
        if (inRect(p, ...ERA_BTNS.back)) { scene = 'title'; sfx.ui(); return; }
        if (inRect(p, ...ERA_BTNS.mute)) { setMuted(!muted); continue; }

        for (let k = 0; k < ERA_LEVELS; k++) if (inRect(p, ...eraTile(k))) {

    },
    draw() { drawEraScreen(); },
  },
  unlock: {
    update(dt) {

      if (!LOAD[unlockEra].ready) { taps = []; return; }
      if (unlockT > tune.unlock_time && unlockT - STEP <= tune.unlock_time) dealLevel(unlockLevel); // dealt once the vehicle has arrived
      if (unlockT > 0.6 && (pressed('Enter') || pressed('Space'))) { go(); return; }

    },

  },
  stats: {
    update() {
      if (pressed('Escape') || pressed('Enter') || pressed('Space') || pressed('KeyL') || pressed('Backspace')) { scene = 'title'; sfx.ui(); return; }
      if (pressed('ArrowRight')) statsEra = Math.max(0, statsEra - 1);

  play: {

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
// What the current scene still waits for from the loader (null: nothing). The era screen and the
// "انتقلت إلى" scene draw their own waiting state.
function waitingFor() {
  if (!titleImg.done) return -1;
  if (scene === 'figures') { const ids = [0, 1, 2, 3, 4].map(k => FIG_WORLD * EPS + k); if (ids.some(k => !LOAD[k].ready)) { ids.forEach(requestEra); return -2; } return null; }

// The title art and the era about to be played load first; the other eras follow in order.
{

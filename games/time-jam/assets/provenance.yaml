# Where each file in assets/ came from. Every image was generated with Dreamina on the owner's account
# (canvas "Sky Taxi · Game Lab", 2026-11-23). Sprite sheets were cut out with Dreamina's image cutout, sliced
# locally into one sprite per colour, resized and saved as WebP. Full-size originals: design/sky-taxi-art/.
# Backgrounds: Dreamina's two corner marks (the small "AI" label, the logo) were taken off on 2026-11-26 at the
# owner's request: tools/clean-marks.js refilled the marks' pixels from the picture around them (sources: the six
# canvas nodes' 1440x2560 downloads). Riders: the modern set was made at the owner's request (bare heads),
# the traditional set is an image-to-image variant of it (robes, bare heads). On 2026-11-24 both sets were
# redrawn facing the viewer (the line now stands above the stops): image-to-image from the back-view sheets,

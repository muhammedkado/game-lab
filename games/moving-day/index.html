const TITLE_BTNS = { start: [150, 560, 420, 116], home: [14, 12, 76, 72], mute: [630, 12, 76, 72], stats: [438, 12, 182, 72] };
const levelBtn = i => [70 + (i % 4) * 150, 740 + Math.floor(i / 4) * 116, 130, 100];
function drawTitle() {
  drawBackground('room' + tune.table_spots);
  const deco = [[0, 150, 420, -0.2], [10, 270, 440, 0.1], [14, 400, 425, -0.1], [12, 530, 430, 0.05], [5, 600, 470, 0.3], [3, 210, 500, 0.15], [9, 360, 505, 0], [1, 480, 500, -0.1]];
  for (const [k, x, y, r] of deco) drawItem(k, x, y, 0.95, r);
  ctx.fillStyle = 'rgba(40,22,10,0.62)'; rrect(40, 150, 640, 220, 30); ctx.fill();
  textOutline('يوم النقل', W / 2, 238, 92, '#ffe9b8', '#6a2e10', 12);
  text('Moving Day', W / 2, 320, 34, '#f3d9a6', 'center', 600);
  const L = Math.min(save.unlocked || 1, tune.levels);
  bigButton(...TITLE_BTNS.start, L > 1 ? `تابع: الغرفة ${L}` : 'اضغط للبدء', '#3f8f4e');
  for (let i = 0; i < tune.levels; i++) {
    const [x, y, w, h] = levelBtn(i), open = i + 1 <= (save.unlocked || 1);
    woodButton(x, y, w, h, open);
    text(String(i + 1), x + w / 2, y + 40, 36, open ? '#fff2d6' : '#9c8a72');
    for (let k = 0; k < 3; k++) drawStar(x + w / 2 + (k - 1) * 28, y + 77, 12, k < (save.stars[i] || 0));
    if (isHard(i + 1)) hardPill(x + w / 2, y + 3, 0.9); // S2: hard rooms say so on their tile
  }
  ctx.fillStyle = 'rgba(40,22,10,0.7)'; rrect(30, 990, 660, 210, 24); ctx.fill();
  CONTROLS.forEach((c, i) => text(c, W / 2, 1026 + i * 46, i < 2 ? 28 : 26, i < 2 ? '#fff2d6' : '#e8cc9a', 'center', i < 2 ? 700 : 600));
  text(`نجومك: ${totalStars()} من ${tune.levels * 3}`, W / 2, 1236, 26, '#fff2d6', 'center', 600);
  if (location.protocol.startsWith('http')) { woodButton(...TITLE_BTNS.home); drawIcon('home', TITLE_BTNS.home[0] + 38, TITLE_BTNS.home[1] + 36, 46, '#fff2d6'); }
  woodButton(...TITLE_BTNS.mute); drawIcon(muted ? 'mute' : 'sound', TITLE_BTNS.mute[0] + 38, TITLE_BTNS.mute[1] + 36, 44, '#fff2d6');
  const sb = TITLE_BTNS.stats; // S1: the play log
  woodButton(...sb); drawIcon('chart', sb[0] + sb[2] - 30, sb[1] + 36, 38, '#fff2d6');
  text('إحصائياتي', sb[0] + 64, sb[1] + 38, 26, '#fff2d6');
}
// ---- S1: the play log panel, "إحصائياتي" -------------------------------------------------------
const STATS_BTNS = { back: [372, 1060, 300, 96], clear: [48, 1060, 300, 96] };
let statsClearT = -9, gt = 0; // gt: time on the title and log screens; a second tap on "clear" within 3 s wipes the log
function drawStats() {
  drawBackground('room' + tune.table_spots);
  ctx.fillStyle = 'rgba(20,10,4,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rrect(28, 112, 672, 1080, 30); ctx.fill();
  const gr = ctx.createLinearGradient(0, 104, 0, 1184); gr.addColorStop(0, '#fbf0d8'); gr.addColorStop(1, '#efd9ae');
  ctx.fillStyle = gr; rrect(24, 104, 672, 1080, 30); ctx.fill();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#c89a5a'; ctx.lineWidth = 2; rrect(38, 118, 644, 1052, 22); ctx.stroke();
  drawIcon('chart', W / 2 + 128, 166, 44, '#8a5a2a');
  text('إحصائياتي', W / 2 - 20, 168, 48, '#4a2c14');
  text('سجل على هذا الجهاز فقط، لا يُرسل إلى أي مكان', W / 2, 218, 24, '#6a4a2a', 'center', 600);
  const recs = []; let A = 0, Wn = 0, Lo = 0, F = 0, Fp = 0;
  for (let L = 1; L <= tune.levels; L++) {
    const r = playLog.levels[String(L)] || null; recs.push(r);
    if (!r) continue;
    A += r.attempts; Wn += r.wins; Lo += r.lost;
    if (r.firstTryWin != null) { Fp++; if (r.firstTryWin === 1) F++; }
  }
  text(`محاولات: ${A} · فوز: ${Wn} · امتلأت الطاولة: ${Lo}`, W / 2, 262, 28, '#4a2c14');
  text(`فوز من أول محاولة: ${F} من ${Fp}`, W / 2, 302, 28, '#4a2c14');
  // the table, right to left: room, attempts, wins, first attempt, best time, hints, undos, shuffles
  const heads = [['غرفة'], ['محاولات'], ['فوز'], ['أول', 'محاولة'], ['أفضل', 'وقت'], ['تلميح'], ['تراجع'], ['خلط']];
  const cw = 632 / heads.length, cx = k => 676 - cw * (k + 0.5);
  ctx.fillStyle = 'rgba(138,90,42,0.18)'; rrect(44, 330, 632, 70, 12); ctx.fill();
  heads.forEach((h, k) => h.forEach((w, j) => text(w, cx(k), h.length === 1 ? 366 : 350 + j * 30, 24, '#5a3416')));
  const RH = 64, y0 = 436;
  recs.forEach((r, i) => {
    const y = y0 + i * RH, L = i + 1;
    if (i % 2) { ctx.fillStyle = 'rgba(150,100,50,0.1)'; rrect(44, y - RH / 2, 632, RH, 8); ctx.fill(); }
    if (isHard(L)) { ctx.fillStyle = '#b8321f'; rrect(cx(0) - 24, y - 18, 48, 36, 18); ctx.fill(); text(String(L), cx(0), y + 1, 28, '#fff6e6'); }
    else text(String(L), cx(0), y + 1, 28, '#4a2c14');
    if (!r || !r.attempts) { for (let k = 1; k < heads.length; k++) dashMark(cx(k), y, 'rgba(90,52,22,0.45)'); return; }
    text(String(r.attempts), cx(1), y + 1, 28, '#4a2c14');
    text(String(r.wins), cx(2), y + 1, 28, '#4a2c14');
    if (r.firstTryWin === 1) checkMark(cx(3), y, 26, '#3f8f4e');
    else if (r.firstTryWin === 0) crossMark(cx(3), y, 24, '#a8402c');
    else dashMark(cx(3), y, 'rgba(90,52,22,0.45)');
    if (r.bestTime != null) text(fmtTime(r.bestTime), cx(4), y + 1, 28, '#4a2c14'); else dashMark(cx(4), y, 'rgba(90,52,22,0.45)');
    text(String(r.hints), cx(5), y + 1, 28, '#4a2c14');
    text(String(r.undos), cx(6), y + 1, 28, '#4a2c14');
    text(String(r.shuffles), cx(7), y + 1, 28, '#4a2c14');
  });
  const ly = y0 + recs.length * RH + 10;
  ctx.fillStyle = '#b8321f'; rrect(W / 2 + 84, ly - 16, 44, 32, 16); ctx.fill(); text('3', W / 2 + 106, ly + 1, 24, '#fff6e6');
  text('غرفة صعبة', W / 2 - 4, ly + 1, 24, '#5a3416');
  bigButton(...STATS_BTNS.back, 'رجوع', '#3f8f4e');
  const armed = gt - statsClearT < 3;
  bigButton(...STATS_BTNS.clear, armed ? 'اضغط للتأكيد' : 'مسح السجل', armed ? '#a8402c' : '#8a5a2a');
}
function drawFigures() {
  ctx.fillStyle = '#f2dcb4'; ctx.fillRect(0, 0, W, H);
  text('القطع · Figures', W / 2, 44, 36, '#4a2c14');
  for (let k = 0; k < 16; k++) {
    const x = 96 + (k % 4) * 176, y = 150 + Math.floor(k / 4) * 196;
    drawItem(k, x, y, 1.1);
    text(KIND_NAMES[k], x, y + 76, 24, '#4a2c14');
  }
  text('مغطّاة (مظلّلة)', 150, 1110, 24, '#4a2c14');
  drawItem(3, 110, 1000, 0.9, 0, true); drawItem(10, 180, 1010, 0.9, 0, false);
  const b = { kind: 1, landed: 2 };
  ctx.save(); ctx.translate(0, 170);
  drawBoxBack(470, 0, { flap: 0 }); drawItem(1, 470 - 60, BOX_TOP - 2, 0.66); drawItem(1, 470, BOX_TOP - 2, 0.66);
  drawBoxFront(b, 470, 0, { flap: 0, tape: 0 }, 0);
  ctx.restore();
  text('صندوق بملصق مرسوم', 470, 1250, 24, '#4a2c14');
  hardPill(150, 1180, 1); text('وسم صعبة', 150, 1230, 24, '#4a2c14');
}

// ---- Scenes ---------------------------------------------------------------------------------
function takeTap() { return taps.length ? taps.shift() : null; }
function updateWorld(dt) {
  const t = state.t;
  for (let k = state.fx.length - 1; k >= 0; k--) {
    const f = state.fx[k]; if (f.t > t) continue;
    state.fx.splice(k, 1);
    if (f.k === 'land') { sfx.land(f.pos); const p = itemPose(f.id, t); for (let j = 0; j < 6; j++) state.parts.push({ x: p.x, y: p.y, vx: (rng() - 0.5) * 160, vy: -rng() * 140, r: 3, life: 0.45, max: 0.45, col: '#fff6d0' }); }
    else if (f.k === 'park') sfx.park();
    else if (f.k === 'flaps') sfx.flaps();
    else if (f.k === 'tape') sfx.tape();
    else if (f.k === 'out') sfx.out();
    else if (f.k === 'jump') sfx.jump();
  }
  for (let k = state.parts.length - 1; k >= 0; k--) {
    const p = state.parts[k]; p.life -= dt; if (p.life <= 0) { state.parts.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 200) * dt;
  }
}
function moveCursor(dir) {
  const free = freeList(); state.kbd = true;
  if (!free.length) { state.cursor = -1; return; }
  const items = state.lv.items;
  free.sort((a, b) => (items[a].x - items[b].x) || (items[a].y - items[b].y));
  let j = free.indexOf(state.cursor);
  if (j < 0) { let best = 0, bd = 1e9; free.forEach((i, k) => { const d = Math.hypot(items[i].x - PILE_CX, items[i].y - PILE_CY); if (d < bd) { bd = d; best = k; } }); j = dir === 0 ? best : best - dir; }
  j = (j + dir + free.length) % free.length;
  state.cursor = free[j];
}
function itemAt(p) { // the topmost pile item under the finger
  const lv = state.lv, S = state.S, s = pileScale();
  for (let i = lv.items.length - 1; i >= 0; i--) {
    if (S.loc[i] !== 0) continue;
    const it = lv.items[i], dx = (p.x - it.x) / (48 * s), dy = (p.y - it.y) / (46 * s);
    if (dx * dx + dy * dy <= 1) return i;
  }
  return -1;
}
function playInput() {
  if (pressed('Escape')) { scene = 'title'; return; }
  if (pressed('KeyU')) doUndo();
  if (pressed('KeyS')) doShuffle();
  if (pressed('KeyR')) { doRestart(); return; }
  if (pressed('ArrowRight') || pressed('ArrowDown')) moveCursor(1);
  if (pressed('ArrowLeft') || pressed('ArrowUp')) moveCursor(-1);
  if (pressed('Space') || pressed('Enter')) {
    if (state.cursor < 0 || !isFreeNow(state.cursor)) moveCursor(0);
    if (state.cursor >= 0) { const c = state.cursor; doPick(c); if (!isFreeNow(state.cursor)) moveCursor(0); }
  }
  let p;
  while ((p = takeTap())) {
    if (inRect(p, ...BTN.mute)) { setMuted(!muted); continue; }
    if (inRect(p, ...BTN.menu)) { scene = 'title'; sfx.ui(); return; }
    if (inRect(p, ...BTN.shuffle)) { doShuffle(); continue; }
    if (inRect(p, ...BTN.undo)) { doUndo(); continue; }
    if (inRect(p, ...BTN.restart)) { doRestart(); return; }
    const i = itemAt(p);
    if (i >= 0) { state.kbd = false; doPick(i); }
  }
}
const scenes = {
  figures: { update(dt) { state.t += dt; }, draw() { drawFigures(); } },
  title: {
    update() {
      const L = Math.min(save.unlocked || 1, tune.levels);
      if (pressed('Enter') || pressed('Space')) { startLevel(L); scene = 'play'; sfx.ui(); return; }
      if (pressed('KeyL')) { scene = 'stats'; statsClearT = -9; sfx.ui(); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...TITLE_BTNS.mute)) { setMuted(!muted); continue; }
        if (location.protocol.startsWith('http') && inRect(p, ...TITLE_BTNS.home)) { location.href = '../../'; return; }
        if (inRect(p, ...TITLE_BTNS.stats)) { scene = 'stats'; statsClearT = -9; sfx.ui(); return; }
        if (inRect(p, ...TITLE_BTNS.start)) { startLevel(L); scene = 'play'; sfx.ui(); return; }
        for (let i = 0; i < tune.levels; i++) if (inRect(p, ...levelBtn(i)) && i + 1 <= (save.unlocked || 1)) { startLevel(i + 1); scene = 'play'; sfx.ui(); return; }
      }
    },
    draw() { drawTitle(); },
  },
  stats: {
    update() {
      if (pressed('Escape') || pressed('Enter') || pressed('Space') || pressed('KeyL') || pressed('Backspace')) { scene = 'title'; sfx.ui(); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...STATS_BTNS.back)) { scene = 'title'; sfx.ui(); return; }
        if (inRect(p, ...STATS_BTNS.clear)) {
          if (gt - statsClearT < 3) { logClear(); statsClearT = -9; sfx.undo(); events.push({ type: 'log-cleared' }); }
          else { statsClearT = gt; sfx.ui(); }
        }
      }
    },
    draw() { drawStats(); },
  },
  play: {
    update(dt) {
      state.t += dt;
      playInput();
      if (scene !== 'play') return;
      updateWorld(dt);
      maybeHint();
      if (state.pending && state.t >= state.busyUntil + 0.3) {
        if (state.pending === 'win') finishLevel();
        else {
          scene = 'over'; sfx.lose(); state.gained = 'الطاولة امتلأت'; events.push({ type: 'over', level: state.level });
          const r = logRec(state.level); r.lost++; logSave();
        }
      }
    },
    draw() { drawPlay(); },
  },
  over: {
    update(dt) {
      state.t += dt; updateWorld(dt);
      if (pressed('KeyR') || pressed('Enter') || pressed('Space')) { doRestart(); return; }
      if (pressed('KeyU')) { doUndo(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...OVER_BTNS.restart)) { doRestart(); return; }
        if (inRect(p, ...OVER_BTNS.undo) && state.undos > 0 && state.hist.length) { doUndo(); return; }
      }
    },
    draw() { drawOver(); },
  },
  results: {
    update(dt) {
      state.t += dt; updateWorld(dt);
      const L = state.level, next = () => { if (L >= tune.levels) scene = 'title'; else { startLevel(L + 1); scene = 'play'; } sfx.ui(); };
      if (pressed('Enter') || pressed('Space')) { next(); return; }
      if (pressed('KeyR')) { doRestart(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...RES_BTNS.next)) { next(); return; }
        if (inRect(p, ...RES_BTNS.again)) { doRestart(); return; }
      }
    },
    draw() { drawResults(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  taps = tapQueue.splice(0);
  gt += STEP;
  scenes[scene].update(STEP); hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

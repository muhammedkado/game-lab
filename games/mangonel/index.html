function playPointer(e) {

    if (state.drag) return;

    if (inCircle(e, BTN.restart)) { startLevel(state.level); return; }

      for (const k of AMMO) { const t = TRAY[k]; if (inRect(e, t.x - TRAY_W / 2, t.y - TRAY_H / 2, TRAY_W, TRAY_H)) selectAmmo(k); }
      return;
    }
    if (e.y < 110) return;
    if (state.mode === 'aim' && state.ammo[state.sel] > 0) {
      state.drag = { id: e.id, sx: e.x, sy: e.y, x: e.x, y: e.y, ang0: state.ang, pow0: state.pow, live: false };
      state.tutorial = false;

    const d = state.drag;
    if (e.t === 'move' || e.t === 'up') {
      d.x = e.x; d.y = e.y;
      const dx = d.sx - d.x, dy = d.y - d.sy, len = Math.hypot(dx, dy);
      if (len >= tune.dragMin) {
        if (!d.live) sfx.pull();

        state.ang = clamp(Math.atan2(dy, dx) / D2R, AMIN, AMAX);
        state.pow = clamp(len / tune.dragMax, 0, 1);

    } else { state.ang = d.ang0; state.pow = d.pow0; state.drag = null; }
  }
}

  pause: {

function drawGroundBand(pits) {

let LW = 1 / 55; // one screen pixel in world units
function sandPath(b) {

function drawSand(b) {

  g.addColorStop(0, '#f3c98e'); g.addColorStop(1, '#c98f58');

    else { ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(9, -8); ctx.lineTo(21, 8); ctx.moveTo(21, -8); ctx.lineTo(9, 8); ctx.stroke(); }
  } else if (kind === 'home') {
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(0, -17); ctx.lineTo(18, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, -3); ctx.lineTo(-12, 16); ctx.lineTo(-3, 16); ctx.lineTo(-3, 6); ctx.lineTo(3, 6); ctx.lineTo(3, 16); ctx.lineTo(12, 16); ctx.lineTo(12, -3); ctx.stroke();
  }
}
function starPath(x, y, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function drawStar(x, y, R, on, pop = 1) {
  starPath(x, y, R * pop, R * 0.45 * pop);
  if (on) { const g = ctx.createLinearGradient(x, y - R, x, y + R); g.addColorStop(0, '#ffe58a'); g.addColorStop(1, '#f0a02e'); ctx.fillStyle = g; }
  else ctx.fillStyle = 'rgba(80,50,60,0.55)';
  ctx.fill(); ctx.strokeStyle = on ? '#8a4a12' : 'rgba(255,230,200,0.4)'; ctx.lineWidth = 4; ctx.stroke();
}
function panel(y0, h) {
  ctx.fillStyle = 'rgba(25,14,32,0.55)'; ctx.fillRect(0, 0, W, H);
  rrect(60, y0, 600, h, 34);
  const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, '#fbe6c4'); g.addColorStop(1, '#eac595');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#7c4523'; ctx.lineWidth = 5; ctx.stroke();
}
function wideButton(b, label, primary) {
  rrect(b.x, b.y, b.w, b.h, 24);
  ctx.fillStyle = primary ? '#c8643c' : '#8d5a2d'; ctx.fill(); ctx.strokeStyle = '#4a1d0e'; ctx.lineWidth = 4; ctx.stroke();
  text(label, b.x + b.w / 2, b.y + b.h / 2 + 2, 32, '#fff3e0', 'center', '700');
}
function drawOverlay(title, sub, labels) {
  panel(470, 660);
  text(title, W / 2, 560, 48, '#5a2f17', 'center', '800');
  if (sub) text(sub, W / 2, 640, 28, '#7a4a2a', 'center', '600');
  const bs = overlayButtons();
  labels.forEach((l, i) => wideButton(bs[i], l, i === 0));
}
function drawResults() {
  const r = state.result, last = state.level === 4;
  panel(400, 730);
  text(last ? 'سقط الحصن كله!' : 'أحسنت!', W / 2, 480, 50, '#5a2f17', 'center', '800');
  for (let i = 0; i < 3; i++) {
    const on = i < r.stars && r.t > 0.35 + i * 0.3, age = r.t - (0.35 + i * 0.3);
    const pop = on ? 1 + Math.max(0, 0.35 - age) * 1.2 : 1;
    drawStar(W / 2 + (i - 1) * 140, 600 - (i === 1 ? 20 : 0), 56, on, pop);
  }
  text(last ? `مجموع النجوم ${r.total} من 15` : `بقي معك ${r.left} من الذخيرة`, W / 2, 700, 28, '#7a4a2a', 'center', '600');
  const bs = overlayButtons();
  wideButton(bs[0], last ? 'القائمة' : 'المرحلة التالية', true);
  wideButton(bs[1], 'أعد المرحلة', false);
  if (!last) wideButton(bs[2], 'القائمة', false);
}
function levelTile(i) { return { x: 40 + (4 - i) * 132, y: 580, w: 112, h: 128 }; }
function drawTitle() {
  S = 55; state.shx = state.shy = 0;
  drawSky(GY); drawGroundBand([]);
  withWorld(() => {
    drawMangonel(MG.rest + 6 + Math.sin(state.t * 1.5) * 4, -90, 'stone', state.t, 0.4);
    const fake = [{ id: 3, hw: 0.2, hh: 0.8, x: 9.4, y: 0.8 }, { id: 4, hw: 0.2, hh: 0.8, x: 10.6, y: 0.8 }, { id: 5, hw: 0.9, hh: 0.2, x: 10, y: 1.8 }, { id: 6, hw: 0.4, hh: 0.4, x: 10, y: 2.4 }];
    for (const b of fake) { ctx.save(); ctx.translate(b.x, b.y); drawSand(b); ctx.restore(); }
    for (const x of [9.55, 10.45]) { ctx.save(); ctx.translate(x, 3.16); drawJar(); ctx.restore(); }
    ctx.save(); ctx.translate(10, 0.36); drawJar(); ctx.restore();
  });
  // title lettering
  const by = 300 + Math.sin(state.t * 2) * 6;
  textOutlined('منجنيق', W / 2, by, 132, '#ffe3b0', '#4a2440', 'center', '800');
  text('MANGONEL', W / 2, by + 100, 34, '#ffd9b0', 'center', '700');
  text('اهدم الأبراج واكسر كل الجرار', W / 2, by + 160, 30, '#fff0dc', 'center', '600');
  if (onHttp()) iconButton(BTN.home, 'home');
  iconButton(BTN.mute, muted ? 'muted' : 'sound');
  // level tiles
  for (let i = 0; i < 5; i++) {
    const b = levelTile(i), open = unlocked(i), st = saved.stars[i] || 0;
    rrect(b.x, b.y, b.w, b.h, 18);
    ctx.fillStyle = open ? 'rgba(255,236,206,0.92)' : 'rgba(70,45,60,0.7)'; ctx.fill();
    ctx.strokeStyle = open ? '#7c4523' : 'rgba(255,230,200,0.3)'; ctx.lineWidth = 4; ctx.stroke();
    text(`${i + 1}`, b.x + b.w / 2, b.y + 50, 44, open ? '#5a2f17' : 'rgba(255,230,200,0.45)', 'center', '800');
    for (let s = 0; s < 3; s++) drawStar(b.x + b.w / 2 + (s - 1) * 30, b.y + 100, 13, s < st);
  }
  // tray with controls
  rrect(10, GY + 30, W - 20, H - GY - 40, 26); ctx.fillStyle = 'rgba(60,32,16,0.88)'; ctx.fill();
  const pulse = 0.75 + 0.25 * Math.sin(state.t * 4);
  ctx.globalAlpha = pulse; text('اضغط للبدء', W / 2, GY + 78, 40, '#ffe3b0', 'center', '800'); ctx.globalAlpha = 1;
  text('اسحب إلى الخلف لتصوّب، واترك لترمي', W / 2, GY + 132, 26, '#f6dcc0');
  text('اضغط على الذخيرة لتختارها: حجر · صخرة · قِدر نار', W / 2, GY + 172, 24, '#e9c9a6');
  text('لوحة المفاتيح: الأسهم للزاوية والقوة · مسافة للرمي · 1 2 3 · R', W / 2, GY + 212, 24, '#e9c9a6');
}
function drawFigures() {
  S = 55; LW = 1 / 90;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5d3b72'); g.addColorStop(1, '#f09a6c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text('الأشكال', W / 2, 50, 36, '#fff0dc', 'center', '800');
  const cell = (cx, cy, k, name, draw) => {
    rrect(cx - 110, cy - 130, 220, 250, 20); ctx.fillStyle = 'rgba(255,240,220,0.16)'; ctx.fill();
    ctx.save(); ctx.translate(cx, cy + 10); ctx.scale(k, -k); LW = 1 / k; draw(); ctx.restore();
    text(name, cx, cy + 98, 26, '#fff0dc', 'center', '700');
  };
  const t = state.t;
  const at = (x, y, f) => { ctx.save(); ctx.translate(x, y); f(); ctx.restore(); };
  cell(130, 230, 52, 'منجنيق', () => { ctx.translate(-2.1, -1.3); drawMangonel(MG.rest + 4, -90, 'stone', t, 0.3); });
  cell(360, 230, 150, 'حجر', () => drawStone(0.28));
  cell(590, 230, 110, 'صخرة', () => drawBoulder(0.42));
  cell(130, 500, 140, 'قِدر نار', () => { ctx.translate(0, -0.15); drawFirePot(0.3, t); });
  cell(360, 500, 175, 'جرّة', () => drawJar());
  cell(590, 500, 62, 'حجر رملي', () => { // block, pillars and lintel: one material
    ctx.translate(0, 0.35);
    at(-0.9, -0.8, () => drawSand({ id: 7, hw: 0.4, hh: 0.4 }));
    at(0.1, -0.4, () => drawSand({ id: 8, hw: 0.2, hh: 0.8 })); at(1.1, -0.4, () => drawSand({ id: 9, hw: 0.2, hh: 0.8 }));
    at(0.6, 0.6, () => drawSand({ id: 5, hw: 0.9, hh: 0.2, crack: 1 }));
  });
  cell(130, 770, 72, 'خشب', () => { // posts and a plank: one material
    ctx.translate(0, 0.3);
    at(-0.6, -0.35, () => drawWood({ id: 10, hw: 0.125, hh: 0.75, burn: -1 })); at(0.6, -0.35, () => drawWood({ id: 11, hw: 0.125, hh: 0.75, burn: -1 }));
    at(0, 0.51, () => drawWood({ id: 12, hw: 1.0, hh: 0.11, burn: -1 }));
  });
  cell(360, 770, 80, 'صخر', () => drawRockBox({ id: 12, x: 0, y: 0, hw: 1.1, hh: 0.8 }));
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  while (ptrQ.length) { const e = ptrQ.shift(); const sc = scenes[scene]; if (sc.pointer) sc.pointer(e); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { ctx.setTransform(RATIO, 0, 0, RATIO, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') startLevel(clamp((Number(params.get('level')) || 1) - 1, 0, 4));
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

  const h = s / 2, k = s * 0.16;
  ctx.beginPath(); ctx.moveTo(-h, -h); ctx.lineTo(-k, -h); ctx.arc(0, -h, k, Math.PI, 0, false); ctx.lineTo(h, -h);

const QRIGHT = 650, QLEFT = 50, QTOP = 168, QLINE = 64, QSIZE = 42;
function layoutQuestion(q) {
  ctx.save(); ctx.font = `700 ${QSIZE}px ${HAND}`; ctx.direction = 'rtl';
  const toks = [];
  for (const w of q.split(' ')) {
    const m = w.match(/^(.*?)([.،؟!]*)$/);
    if (m[1]) toks.push({ text: m[1], punct: false });
    for (const c of m[2]) toks.push({ text: c, punct: true });
  }
  const sp = ctx.measureText(' ').width || 12;
  let x = QRIGHT, y = QTOP;
  toks.forEach((t, i) => {
    t.w = ctx.measureText(t.text).width;
    if (!t.punct && i > 0) x -= sp;
    if (!t.punct && x - t.w < QLEFT) { x = QRIGHT; y += QLINE; }
    t.x = x - t.w / 2; t.y = y; x -= t.w;
    Object.assign(t, { id: 'tok' + i, h: QSIZE * 1.4, isTok: true, drag: true, vis: true, home: { x: t.x, y: t.y }, shakeT: 0 });
  });
  ctx.restore();
  return toks;
}

    draw() { drawTitle(); },

  play: {

      if (R.msgT > 0) R.msgT -= dt;

    draw() { drawPlay(); },
  },
  results: {

    ['وردة', 0.5, () => D.rose(true, 1)], ['ثلج', 0.9, () => D.ice(1)], ['شمعة', 0.5, () => D.candle(state.t)], ['قطرة ماء', 1, () => D.drop()],
  ];
  items.forEach(([name, k, fn], i) => {
    const cx = 610 - (i % 4) * 165, cy = 140 + Math.floor(i / 4) * 190;
    ctx.save(); ctx.translate(cx, cy + 50); ctx.scale(k, k); fn(); ctx.restore();
    text(name, cx, cy + 132, 24, INK, 'center', '700');
  });
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  while (ptrQ.length) { const e = ptrQ.shift(); const sc = scenes[scene]; if (sc.pointer) sc.pointer(e); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.setTransform(RATIO, 0, 0, RATIO, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return scene === 'play' && R ? { riddle: R.i + 1, t: R.t, hints: R.hints, solved: R.solved, total: run.totalT } : state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') { run = { practice: -1, totalT: 0, hints: 0, skips: 0, solved: new Array(10).fill(false), times: new Array(10).fill(0) }; startRiddle(clamp((Number(params.get('riddle')) || 1) - 1, 0, 9)); }
if (scene === 'results' && !run) { run = { practice: -1, totalT: 0, hints: 0, skips: 0, solved: new Array(10).fill(false), times: new Array(10).fill(0) }; }
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>

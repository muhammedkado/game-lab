        const r = TILE(n), open = n + 1 <= lv, b = bests[n + 1];
        ctx.fillStyle = open ? '#4a2a14' : '#2a1810'; rr(r.x, r.y, r.w, r.h, 16); ctx.fill();
        ctx.strokeStyle = open ? '#c9963e' : 'rgba(201,150,62,0.3)'; ctx.lineWidth = 2.5; ctx.stroke();
        if (open) {
          text(String(n + 1), r.x + r.w / 2, r.y + 40, 38, '#ffe7b6', 'center', 'bold');
          for (let s = 0; s < 3; s++) drawStar(r.x + r.w / 2 + (s - 1) * 30, r.y + 84, 12, b && s < b.stars);
        } else iconLock(r.x + r.w / 2, r.y + r.h / 2, 56, 'rgba(201,150,62,0.55)');
      }
      CONTROLS.forEach((c, i) => text(c, W / 2, 1214 + i * 36, 25, '#e9d3a8'));
      drawButton(B.mute, '', (x, y, s, c) => iconSpeaker(x, y, s, c, muted));
      if (location.protocol.startsWith('http')) drawButton(B.home, '', iconHouse);
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      state.shake = state.shake.filter(s => state.t - s.t < 0.3);
      if (state.phase === 'deal') { dealStep(); return; }
      if (state.anim) { state.anim.t += dt; if (state.anim.t >= tune.pour_time) state.anim = null; }
      if (state.hint && state.t - state.hint.t > tune.hint_time) state.hint = null;
      if (state.phase === 'won') { if (state.t >= state.winAt && !state.anim) finishLevel(); return; }
      const n = state.st.length, lay = state.lay;
      if (pressed('ArrowRight')) { state.kbd = true; state.cursor = (state.cursor + 1) % n; }
      if (pressed('ArrowLeft')) { state.kbd = true; state.cursor = (state.cursor + n - 1) % n; }
      if ((pressed('ArrowDown') || pressed('ArrowUp')) && lay.rows === 2) {
        state.kbd = true; const P = lay.pos[state.cursor], other = 1 - P.row;
        let best = -1, bd = 1e9; lay.pos.forEach((Q, k) => { if (Q.row === other && Math.abs(Q.x - P.x) < bd) { bd = Math.abs(Q.x - P.x); best = k; } });
        if (best >= 0) state.cursor = best;
      }
      if (pressed('Space') || pressed('Enter')) { state.kbd = true; tapFlask(state.cursor); }
      if (pressed('KeyU') || pressed('Backspace')) undo();
      if (pressed('KeyH')) useHint();
      if (pressed('KeyR')) restartLevel(false);
      if (pressed('Escape')) toTitle();
    },
    pointer(ev) {
      if (handleMute(ev)) return;
      if (state.phase === 'deal') return;
      const btns = state.stuck ? ['menu', 'sUndo', 'sRestart', 'undo', 'restart'] : ['menu', 'undo', 'hint', 'restart'];
      if (ev.type === 'down') {
        state.kbd = false;
        const k = buttonAt(ev, btns); if (k) { state.btnDown = B[k]; return; }
        if (state.stuck || state.phase !== 'play') return;
        const f = flaskAt(ev);
        if (f >= 0) { state.cursor = f; tapFlask(f); }
        else if (state.sel >= 0) { state.sel = -1; sfx.drop(); }
        return;
      }
      if (ev.type === 'up' || ev.type === 'cancel') {
        const was = state.btnDown; state.btnDown = null;
        if (!was || ev.type !== 'up') return;
        const k = buttonAt(ev, btns); if (!k || B[k] !== was) return;
        sfx.ui();
        if (k === 'menu') toTitle();
        else if (k === 'undo' || k === 'sUndo') undo();
        else if (k === 'hint') useHint();
        else if (k === 'restart' || k === 'sRestart') restartLevel(false);
      }
    },
    draw() {
      drawShop();
      drawHud();
      if (state.phase === 'deal') { text('يملأ العطّار القوارير...', W / 2, 640, 32, '#f6e3bd'); return; }
      drawGuide();
      drawBanner();
      drawControls();
      if (state.stuck) {
        ctx.fillStyle = 'rgba(15,8,4,0.66)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#3a2412'; rr(70, 470, W - 140, 300, 28); ctx.fill(); ctx.strokeStyle = '#d6a44c'; ctx.lineWidth = 3; ctx.stroke();
        text('لا توجد سكبات', W / 2, 540, 48, '#ffe2c4', 'center', 'bold');
        text('تراجع أو أعد المستوى، مجانا', W / 2, 596, 28, '#e9d3a8');
        drawButton(B.sUndo, 'تراجع', null, true);
        drawButton(B.sRestart, 'إعادة', null);
      }
    },
  },
  results: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || pressed('Space') || pressed('KeyN')) nextLevel();
      if (pressed('KeyR')) { scene = 'play'; restartLevel(false); }
      if (pressed('Escape')) toTitle();
    },
    pointer(ev) {
      if (handleMute(ev)) return;
      if (ev.type !== 'up') return;
      const k = buttonAt(ev, ['next', 'again']);
      if (k === 'next') nextLevel(); else if (k === 'again') { scene = 'play'; restartLevel(false); }
    },
    draw() {
      drawShop(); drawHud();
      ctx.fillStyle = 'rgba(15,8,4,0.55)'; ctx.fillRect(0, 0, W, H);
      const x = 60, y = 330, w = W - 120, h = 730;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(x + 4, y + 10, w, h, 30); ctx.fill();
      ctx.fillStyle = '#3a2412'; rr(x, y, w, h, 30); ctx.fill(); ctx.strokeStyle = '#d6a44c'; ctx.lineWidth = 4; ctx.stroke();
      text(state.allDone ? 'أكملت رف العطّار كله' : `اكتمل المستوى ${state.level}`, W / 2, y + 76, 44, '#ffe2a6', 'center', 'bold');
      for (let k = 0; k < 3; k++) drawStar(W / 2 + (k - 1) * 118, y + 196, 50, k < state.stars);
      text(`السكبات ${state.moves} · الهدف ${state.par}`, W / 2, y + 300, 34, '#f6e3bd', 'center', 'bold');
      if (state.best) text(`أفضل نتيجة: ${state.best.moves} سكبة`, W / 2, y + 352, 28, '#e9d3a8');
      const why = state.hintUsed ? 'التلميح يحجب النجمة الثالثة' : `ثلاث نجوم بالهدف، ونجمتان حتى ${tune.star2_extra} سكبات زيادة`;
      text(why, W / 2, y + 404, 26, '#e9d3a8');
      drawButton(B.next, state.allDone ? 'القائمة' : 'المستوى التالي', null, true);
      drawButton(B.again, 'أعد المستوى', null);
    },
  },
};
function nextLevel() { if (state.level >= LEVELS) { toTitle(); return; } const lv = state.level + 1; scene = 'play'; startLevel(lv); }

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  const q = ptrQ.splice(0);
  for (const ev of q) if (scenes[scene].pointer) scenes[scene].pointer(ev);
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') startLevel(Number(params.get('level')) || unlocked());
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>

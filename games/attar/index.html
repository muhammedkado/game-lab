      if ((pressed('ArrowDown') || pressed('ArrowUp')) && lay.rows === 2) {
        state.kbd = true; const P = lay.pos[state.cursor], other = 1 - P.row;
        let best = -1, bd = 1e9; lay.pos.forEach((Q, k) => { if (Q.row === other && Math.abs(Q.x - P.x) < bd) { bd = Math.abs(Q.x - P.x); best = k; } });
        if (best >= 0) state.cursor = best;
      }
      if (pressed('Space') || pressed('Enter')) { state.kbd = true; tapFlask(state.cursor); }
      if (pressed('KeyU') || pressed('Backspace')) undo();
      if (pressed('KeyH')) useHint();
      if (pressed('KeyR')) restartLevel(false);
      if (pressed('Escape')) toTitle();
    },
    pointer(ev) {
      if (handleMute(ev)) return;
      if (state.phase === 'deal') return;
      const btns = state.stuck ? [...(stuckOffer() ? ['sExtra'] : []), 'menu', 'sUndo', 'sRestart', 'undo', 'restart'] : ['menu', 'undo', 'hint', 'restart'];
      if (ev.type === 'down') {
        state.kbd = false;
        const k = buttonAt(ev, btns); if (k) { state.btnDown = B[k]; return; }
        if (state.stuck || state.phase !== 'play') return;
        const f = flaskAt(ev);
        if (f >= 0) { state.cursor = f; tapFlask(f); }
        else if (state.sel >= 0) { state.sel = -1; sfx.drop(); }
        return;
      }
      if (ev.type === 'up' || ev.type === 'cancel') {
        const was = state.btnDown; state.btnDown = null;
        if (!was || ev.type !== 'up') return;
        const k = buttonAt(ev, btns); if (!k || B[k] !== was) return;
        sfx.ui();
        if (k === 'menu') toTitle();
        else if (k === 'undo' || k === 'sUndo') undo();
        else if (k === 'hint') useHint();
        else if (k === 'restart' || k === 'sRestart') restartLevel(false);
        else if (k === 'sExtra') askExtraFlask();
      }
    },
    draw() {
      drawShop();
      drawHud();
      if (state.phase === 'deal') { text('يملأ العطّار القوارير...', W / 2, 640, 32, '#f6e3bd'); return; }
      drawGuide();
      drawBanner();
      drawControls();
      if (state.stuck) drawStuck();
    },
  },
  results: {
    update(dt) {
      state.t += dt; stepSparks(dt);
      const age = state.t - state.resAt; // the stars land one by one, each with its chime and sparks
      while (state.starsShown < state.stars && age >= 0.35 + state.starsShown * 0.32) {
        const k = state.starsShown++; sfx.star(k); burst(W / 2 + (1 - k) * 118, 526, CHEAP ? 5 : 12, '#fff2c0', 0.8);
      }
      if (pressed('Enter') || pressed('Space') || pressed('KeyN')) nextLevel();
      else if (pressed('KeyR')) { scene = 'play'; restartLevel(false); }
      else if (pressed('Escape')) toTitle();
    },
    pointer(ev) {
      if (handleMute(ev)) return;
      if (ev.type === 'down') { state.btnDown = B[buttonAt(ev, ['next', 'again'])] || null; return; }
      const was = state.btnDown; state.btnDown = null;
      if (ev.type !== 'up') return;
      const k = buttonAt(ev, ['next', 'again']); if (!k || B[k] !== was) return;
      if (k === 'next') nextLevel(); else { scene = 'play'; restartLevel(false); }
    },
    draw() {
      drawShop(false); drawHud();
      ctx.fillStyle = 'rgba(15,8,4,0.55)'; ctx.fillRect(0, 0, W, H);
      const x = 60, y = 330, w = W - 120, h = 730, age = state.t - state.resAt;
      const here = SOUKS[soukOf(state.level)], more = !state.daily && !state.allDone;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(x + 4, y + 10, w, h, 30); ctx.fill();
      ctx.fillStyle = '#3a2412'; rr(x, y, w, h, 30); ctx.fill(); ctx.strokeStyle = '#d6a44c'; ctx.lineWidth = 4; ctx.stroke();
      text(state.daily ? 'اكتمل عطر اليوم' : state.allDone ? 'أكملت كل الأسواق' : state.soukDone ? `أكملت ${here.souk}` : `اكتمل المستوى ${state.level}`, W / 2, y + 76, 44, '#ffe2a6', 'center', 'bold');
      if (state.hard) drawBadge(x + w - 62, y + 26);
      for (let k = 0; k < 3; k++) { // first star on the right; a landed star swells, then settles
        const on = k < state.starsShown, since = age - (0.35 + k * 0.32);
        drawStar(W / 2 + (1 - k) * 118, y + 196, 50 * (on ? 1 + 0.35 * Math.max(0, 1 - since / 0.25) : 1), on);
      }
      text(`السكبات ${state.moves} · الهدف ${state.par}`, W / 2, y + 300, 34, '#f6e3bd', 'center', 'bold');
      if (state.daily) text(`سلسلة الأيام: ${state.streak}${state.best ? ` · أفضل اليوم: ${state.best.moves} سكبة` : ''}`, W / 2, y + 352, 28, '#ffe2a6', 'center', 'bold');
      else if (state.best) text(`أفضل نتيجة: ${state.best.moves} سكبة`, W / 2, y + 352, 28, '#e9d3a8');
      const why = state.hintUsed ? 'التلميح يحجب النجمة الثالثة' // T2: the gentler rule, said in numbers
        : `ثلاث نجوم بزيادة ${state.s3} سكبات أو أقل على الهدف، ونجمتان بزيادة ${state.s2}`;
      wrap(why, 26, w - 60, '').slice(0, 2).forEach((ln, k) => text(ln, W / 2, y + 404 + k * 32, 26, '#e9d3a8'));
      drawButton(B.next, !more ? 'القائمة' : state.soukDone ? `إلى ${SOUKS[soukOf(state.level + 1)].city}` : 'المستوى التالي', null, true);
      drawButton(B.again, 'أعد المستوى', null);
      drawSparks();
    },
  },
};
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s) % 60).padStart(2, '0')}`;
/** S1: the إحصائياتي panel, read from the local play log. */
function drawStats() {
  drawWall();
  text('إحصائياتي', W / 2, 60, 46, '#ffe7b6', 'center', 'bold');
  const x = 30, y = 112, w = W - 60, h = 1040, ink = '#f6e3bd', soft = '#d8b97e';
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(x + 4, y + 10, w, h, 26); ctx.fill();
  ctx.fillStyle = '#3a2412'; rr(x, y, w, h, 26); ctx.fill(); ctx.strokeStyle = '#d6a44c'; ctx.lineWidth = 3; ctx.stroke();
  text('محفوظة على هذا الجهاز فقط، بلا إنترنت', W / 2, y + 40, 24, soft, 'center', 'bold');
  const L = playLog.read(), rows = Object.values(L.rows), won = rows.filter(r => r.w > 0);
  const sum = k => rows.reduce((t, r) => t + (r[k] || 0), 0);
  [['نجوم', starsIn(1, LEVELS)], ['مكتملة', won.length], ['محاولات', sum('a')], ['تلميحات', sum('h')]].forEach(([lab, n], k) => {
    const tx = x + w - 15 - (k + 1) * 150 - k * 10, ty = y + 76;
    ctx.fillStyle = '#4e3018'; rr(tx, ty, 150, 118, 16); ctx.fill(); ctx.strokeStyle = 'rgba(214,164,76,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    text(String(n), tx + 75, ty + 46, 44, '#ffe2a6', 'center', 'bold'); text(lab, tx + 75, ty + 94, 24, soft, 'center', 'bold');
  });
  text(`الفوز من أول محاولة: ${won.filter(r => r.f === 1).length} من ${won.length} · قوارير صغيرة: ${sum('e')}`, W / 2, y + 236, 26, ink, 'center', 'bold');
  const sk = streakNow(), daysWon = rows.filter(r => r.d && r.w > 0).length;
  text(`عطر اليوم: سلسلة ${sk.n} · الأطول ${sk.best || 0} · أيام محلولة ${daysWon}`, W / 2, y + 280, 26, ink, 'center', 'bold');
  const R = x + w - 30, cols = [462, 372, 280, 184, 88];
  text('آخر المستويات التي لعبتها', R, y + 336, 28, '#ffe2a6', 'right', 'bold');
  ['المستوى', 'محاولات', 'فوز', 'سكبات', 'وقت', 'تلميح'].forEach((nm, k) => k === 0 ? text(nm, R, y + 378, 24, soft, 'right', 'bold') : text(nm, cols[k - 1], y + 378, 24, soft, 'center', 'bold'));
  ctx.strokeStyle = 'rgba(214,164,76,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 30, y + 400); ctx.lineTo(R, y + 400); ctx.stroke();
  const list = rows.filter(r => r.lvl).sort((a, b) => (b.q || 0) - (a.q || 0)).slice(0, 12).sort((a, b) => a.lvl - b.lvl); // the twelve played last
  const today = L.rows['D' + dateKey()]; if (today) list.push(today);
  list.forEach((r, k) => {
    const yy = y + 440 + k * 46, name = r.lvl ? String(r.lvl) : 'اليوم';
    text(name, R, yy, 26, ink, 'right', 'bold');
    if (r.hard) { setFont(26, 'bold'); const tw = ctx.measureText(name).width; drawBadge(R - tw - 12 - badgeW(32) / 2, yy, 32); }
    text(String(r.a), cols[0], yy, 26, ink, 'center');
    text(String(r.w), cols[1], yy, 26, ink, 'center');
    text(r.bm == null ? '-' : `${r.bm} / ${r.par}`, cols[2], yy, 26, ink, 'center');
    text(r.bt == null ? '-' : fmtTime(r.bt), cols[3], yy, 26, ink, 'center');
    text(String(r.h), cols[4], yy, 26, ink, 'center');
  });
  if (!list.length) text('العب مستوى، وستظهر أرقامه هنا', W / 2, y + 450, 26, soft, 'center', 'bold');
}
function nextLevel() {
  if (state.daily || state.level >= LEVELS) { toTitle(); return; }
  if (ADS.busy) return;
  const lv = state.level, go = () => { if (scene === 'results' && state.level === lv) { scene = 'play'; startLevel(lv + 1); } };
  // A1: a short ad between levels: only here, after a win, by the rules in ads.js (never on the way into a new souk)
  if (adsOn() && ADS.interstitialDue(lv, state.soukDone)) ADS.interstitial('between_levels').then(go); else go();
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
let adUp = false;
function step() {
  if (ADS.busy !== adUp) { adUp = ADS.busy; if (audio) audio.out.gain.value = muted || adUp ? 0 : tune.volume; } // an ad owns the sound while it is up
  if (adUp) { ptrQ.length = 0; hit.clear(); return; } // and the game waits under it: no input, no clock
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  const q = ptrQ.splice(0);
  for (const ev of q) if (scenes[scene].pointer) scenes[scene].pointer(ev);
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') startLevel(Number(params.get('level')) || unlocked());
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(mx + (view.camX - W / 2 / CS) * sc, my + (view.camY - H / 2 / CS) * sc, W / CS * sc, H / CS * sc);
  // message line
  if (state.msg && state.t < state.msg.until) {
    ctx.globalAlpha = clamp((state.msg.until - state.t) * 2, 0, 1);
    pill(state.msg.s, W / 2, 300, 30, state.msg.col, 'rgba(40,20,8,0.84)');
    ctx.globalAlpha = 1;
  }
  const pl = riders[0];
  if (pl.wait && state.alive) pill('اسحب في أي اتجاه لتنطلق', W / 2, 960, 30, '#fff', 'rgba(40,20,8,0.8)');
  // the touch stick
  if (ptr.id !== null && ptr.stick && scene === 'play') {
    const R = tune.stick_radius, vx = ptr.x - ptr.ox, vy = ptr.y - ptr.oy, L = Math.hypot(vx, vy), k = L > R ? R / L : 1;
    ctx.fillStyle = 'rgba(255,246,225,0.22)'; circ(ctx, ptr.ox, ptr.oy, R); ctx.fill();
    ctx.strokeStyle = 'rgba(60,35,15,0.55)'; ctx.lineWidth = 4; circ(ctx, ptr.ox, ptr.oy, R); ctx.stroke();
    const kx = ptr.ox + vx * k, ky = ptr.oy + vy * k, g = ctx.createRadialGradient(kx - 8, ky - 8, 4, kx, ky, 36);
    g.addColorStop(0, FACTIONS[1].light); g.addColorStop(1, FACTIONS[1].col);
    ctx.fillStyle = g; circ(ctx, kx, ky, 34); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  }
}
function drawSandBg() { ctx.fillStyle = sandPat; ctx.fillRect(0, 0, W, H); }
function drawRug(x, y, w, h, f) {
  ctx.fillStyle = 'rgba(90,55,20,0.3)'; ctx.fillRect(x + 8, y + 10, w, h);
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = ctx.createPattern(rugTiles[f], 'repeat'); ctx.fillRect(0, 0, w, h); ctx.restore();
  ctx.strokeStyle = FACTIONS[f].dark; ctx.lineWidth = 8; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.strokeRect(x + 11, y + 11, w - 22, h - 22); ctx.setLineDash([]);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 3;
  for (let k = x + 8; k < x + w - 4; k += 9) { line(ctx, k, y, k + (k % 2), y - 12); line(ctx, k, y + h, k - (k % 2), y + h + 12); }
}

// ---- Scenes ---------------------------------------------------------------------------
const BTN_AGAIN = [150, 930, 420, 100], BTN_MENU = [210, 1052, 300, 84];
const BTN_RESUME = [150, 540, 420, 100], BTN_RESTART = [150, 664, 420, 100], BTN_QUIT = [150, 788, 420, 100];
function bigButton(b, s, main) {
  ctx.fillStyle = 'rgba(30,15,5,0.35)'; rr(ctx, b[0] + 4, b[1] + 6, b[2], b[3], 24); ctx.fill();
  ctx.save(); rr(ctx, b[0], b[1], b[2], b[3], 24); ctx.clip();
  ctx.fillStyle = main ? ctx.createPattern(rugTiles[1], 'repeat') : '#6b4423'; ctx.fillRect(b[0], b[1], b[2], b[3]);
  ctx.fillStyle = main ? 'rgba(22,58,134,0.55)' : 'rgba(0,0,0,0)'; ctx.fillRect(b[0], b[1], b[2], b[3]); ctx.restore();
  ctx.strokeStyle = CREAM; ctx.lineWidth = 3; rr(ctx, b[0] + 5, b[1] + 5, b[2] - 10, b[3] - 10, 20); ctx.stroke();
  text(s, b[0] + b[2] / 2, b[1] + b[3] / 2 + 2, main ? 38 : 32, '#fff', 'center', 'bold');
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      drawSandBg();
      text('شخصيات رمال وأشكالها', W / 2, 60, 36, '#3b2412', 'center', 'bold');
      const cells = [[180, 250], [540, 250], [180, 560], [540, 560], [180, 870], [540, 870], [180, 1150], [540, 1150]];
      const t = state.t;
      const riderFig = (k, f, kind, label) => {
        const [x, y] = cells[k];
        ctx.fillStyle = 'rgba(255,245,220,0.35)'; rr(ctx, x - 165, y - 150, 330, 290, 24); ctx.fill();
        drawRider(ctx, x, y - 20, -0.5, f, kind, t * 6, 3.0, t);
        text(label, x, y + 115, 28, '#3b2412', 'center', 'bold');
      };
      riderFig(0, 1, 'player', 'أنت · راكب بعلم مشقوق');
      riderFig(1, 2, 'hunter', 'بوت صيّاد · رمح طويل');
      riderFig(2, 3, 'greedy', 'بوت طمّاع · خُرج ممتلئ');
      riderFig(3, 4, 'cautious', 'بوت حذِر · ترس مستدير');
      { // trail of footprints
        const [x, y] = cells[4];
        ctx.fillStyle = 'rgba(255,245,220,0.35)'; rr(ctx, x - 165, y - 150, 330, 290, 24); ctx.fill();
        for (let j = 0; j < 7; j++) { ctx.save(); ctx.translate(x - 126 + j * 36, y - 40 + Math.sin(j) * 20); ctx.scale(2, 2); ctx.drawImage(prints[1][0][j & 1], -9, -9); ctx.restore(); }
        text('أثر الأقدام', x, y + 115, 28, '#3b2412', 'center', 'bold');
      }
      { // oasis
        const [x, y] = cells[5], img = oasisImgs[0];
        ctx.fillStyle = 'rgba(255,245,220,0.35)'; rr(ctx, x - 165, y - 150, 330, 290, 24); ctx.fill();
        ctx.drawImage(img, x - img.width * 0.6, y - 30 - img.height * 0.6, img.width * 1.2, img.height * 1.2);
        text('واحة نخيل', x, y + 115, 28, '#3b2412', 'center', 'bold');
      }
      { // six rugs
        const [x, y] = cells[6];
        for (let f = 1; f <= 6; f++) drawRug(x - 160 + ((f - 1) % 3) * 110, y - 120 + ((f - 1) / 3 | 0) * 90, 96, 70, f);
        text('سجاد كل فريق', x, y + 70, 28, '#3b2412', 'center', 'bold');
      }
      { // a rug front rolling
        const [x, y] = cells[7];
        drawRug(x - 150, y - 120, 200, 150, 1);
        for (let j = 0; j < 6; j++) ctx.drawImage(rolls[1], x + 50, y - 120 + j * 25, 30, 30);
        text('السجادة تنفرد', x, y + 70, 28, '#3b2412', 'center', 'bold');
      }
    },
  },
  title: {
    update() {
      for (const p of tapList) {
        if (location.protocol.startsWith('http') && inRect(p, BTN_HOME)) { location.href = '../../'; return; }
        startRound(); return;
      }
      if (pressed('Enter') || pressed('Space')) startRound();
      state.t += STEP;
    },
    draw() {
      drawSandBg();
      if (location.protocol.startsWith('http')) drawButton(BTN_HOME, 'home');
      const t = clock.now();
      text(TITLE, W / 2, 190, 140, '#3b2412', 'center', 'bold');
      text(TITLE_EN, W / 2, 300, 40, '#6b4423', 'center', 'bold');
      drawRug(110, 360, 500, 270, 1);
      for (let j = 0; j < 22; j++) { const a = j / 22 * TAU; drawPrint(ctx, 360 + Math.cos(a) * 300, 495 + Math.sin(a) * 172, a + Math.PI / 2, 1.8, j & 1, FACTIONS[1].dark); }
      drawRider(ctx, 360, 495, -0.25, 1, 'player', t * 4, 3.0, t);
      CONTROLS.forEach((c, i) => text(c, W / 2, 712 + i * 52, 28, '#3b2412', 'center', i === 1 ? 'bold' : ''));
      text('المنافسون الخمسة بوتات وليسوا لاعبين حقيقيين', W / 2, 990, 26, '#6b4423', 'center');
      if (state.best > 0) text(`أفضل نتيجة لك: ${state.best.toFixed(1)}%`, W / 2, 1050, 30, '#163a86', 'center', 'bold');
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 4);
      pill('المس الشاشة للبدء', W / 2, 1160, 44, '#fff', hexA(FACTIONS[1].dark, 0.92));
      ctx.globalAlpha = 1;
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      for (const p of tapList) {
        if (inRect(p, BTN_PAUSE)) { scene = 'pause'; return; }
        if (inRect(p, BTN_MUTE)) setMuted(!muted);
      }
      state.t += dt;
      const pl = riders[0];
      if (pl.alive) playerInput(pl);
      for (const r of riders) {
        if (!r.alive) { if (!r.isPlayer && state.t >= r.respawnT) respawn(r); continue; }
        if (!r.isPlayer) botThink(r, dt);
        if (r.wait) { r.px = r.x; r.py = r.y; continue; }
        moveRider(r, dt);
      }
      updateOases(); updateReveal(); updateParts(dt);
      if (pl.alive && !pl.wait) {
        const k = 1 - Math.exp(-dt * 2.5);
        state.lookX = lerp(state.lookX, Math.cos(pl.a) * 3, k); state.lookY = lerp(state.lookY, Math.sin(pl.a) * 3, k);
      }
      state.shake *= 0.9;
      state.pct = state.alive ? pct(1) : state.final; state.score = +state.pct.toFixed(1);
      if (!state.safeSaid && state.t >= tune.safe_time) { state.safeSaid = true; say('انتهى وقت الأمان: البوتات تتوسع الآن', '#ffe9a8', 2.6); }
      const left = tune.round_time - state.t;
      if (left < 10 && Math.ceil(left) !== state.lastTick) { state.lastTick = Math.ceil(left); sfx.tick(); }
      if (!state.alive) { if (state.t >= state.endT) endRound('out'); return; }
      if (pct(1) >= tune.win_percent) { endRound('win'); return; }
      for (const r of riders) if (!r.isPlayer && r.alive && pct(r.id) >= tune.win_percent) { endRound('botwin', r.id); return; }
      if (state.t >= tune.round_time) endRound('time');
    },
    draw() { const v = drawWorld(); drawHUD(v); },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape') || pressed('Enter') || pressed('Space')) { scene = 'play'; return; }
      if (pressed('KeyR')) { startRound(); return; }
      for (const p of tapList) {
        if (inRect(p, BTN_RESUME)) { scene = 'play'; return; }
        if (inRect(p, BTN_RESTART)) { startRound(); return; }
        if (inRect(p, BTN_QUIT)) { reset(); scene = 'title'; return; }
      }
    },
    draw() {
      const v = drawWorld(); drawHUD(v);
      ctx.fillStyle = 'rgba(30,15,5,0.62)'; ctx.fillRect(0, 0, W, H);
      text('استراحة', W / 2, 400, 72, '#fff', 'center', 'bold');
      bigButton(BTN_RESUME, 'متابعة', true); bigButton(BTN_RESTART, 'جولة جديدة'); bigButton(BTN_QUIT, 'القائمة');
      text('P أو Esc للمتابعة', W / 2, 950, 26, '#e9d6b0', 'center');
    },
  },
  results: {
    update() {
      if (pressed('Enter') || pressed('Space') || pressed('KeyR')) { startRound(); return; }
      if (pressed('Escape')) { reset(); scene = 'title'; return; }
      for (const p of tapList) {
        if (inRect(p, BTN_AGAIN)) { startRound(); return; }
        if (inRect(p, BTN_MENU)) { reset(); scene = 'title'; return; }
      }
    },
    draw() {
      const v = drawWorld(); drawHUD(v);
      ctx.fillStyle = 'rgba(30,15,5,0.66)'; ctx.fillRect(0, 0, W, H);
      const R = state.result;
      ctx.fillStyle = 'rgba(70,40,15,0.94)'; rr(ctx, 60, 150, 600, 1010, 30); ctx.fill();
      ctx.strokeStyle = FACTIONS[1].col; ctx.lineWidth = 8; rr(ctx, 70, 160, 580, 990, 24); ctx.stroke();
      let head, sub;
      if (R.reason === 'win') { head = 'فزت بالجولة'; sub = `وصلت إلى ${tune.win_percent}% من الصحراء`; }
      else if (R.reason === 'botwin') { head = 'انتهت الجولة'; sub = `${FACTIONS[R.who].name} وصل إلى ${tune.win_percent}%`; }
      else if (R.reason === 'time') { head = R.rank === 1 ? 'فزت بالجولة' : 'انتهى الوقت'; sub = R.rank === 1 ? 'أرضك هي الأكبر' : `مركزك ${R.rank} من 6`; }
      else {
        head = 'خرجت من الجولة';
        sub = state.why === 'self' ? 'قطعتَ أثرك بنفسك' : state.why === 'land' ? `${FACTIONS[state.killer].name} أخذ كل أرضك` : `${FACTIONS[state.killer].name} قطع أثرك`;
      }
      text(head, W / 2, 240, 56, '#fff', 'center', 'bold');
      text(sub, W / 2, 310, 30, '#f3d9a6', 'center');
      text(`أرضك ${R.fin.toFixed(1)}%`, W / 2, 390, 48, FACTIONS[1].light, 'center', 'bold');
      text(R.newBest ? 'رقم شخصي جديد' : `أفضل نتيجة: ${state.best.toFixed(1)}%`, W / 2, 450, 28, R.newBest ? '#ffe08a' : '#e9d6b0', 'center', 'bold');
      R.stand.forEach((s, k) => {
        const y = 530 + k * 58, F = FACTIONS[s.f];
        if (s.f === 1) { ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(ctx, 110, y - 26, 500, 52, 12); ctx.fill(); }
        text(`${k + 1}`, 590, y, 30, '#e9d6b0', 'center', 'bold');
        ctx.drawImage(rugTiles[s.f], 18, 18, 36, 36, 530, y - 17, 34, 34);
        text(s.f === 1 ? 'أنت' : `${F.name} · ${KIND_AR[F.kind]}`, 515, y, 28, '#fff', 'right', s.f === 1 ? 'bold' : '');
        text(`${s.p.toFixed(1)}%`, 130, y, 28, '#ffe9a8', 'left', 'bold');
      });
      text(`أثر قطعته: ${state.kills}`, W / 2, 890, 28, '#e9d6b0', 'center');
      bigButton(BTN_AGAIN, 'العب مجددًا', true); bigButton(BTN_MENU, 'القائمة');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  tapList = taps.splice(0);
  scenes[scene].update(STEP); hit.clear(); tapList = [];
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') scene = 'pause'; });

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

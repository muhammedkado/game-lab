function handleBoardPointer(dt) {
  for (const e of pq) {
    if (e.t === 'down') {
      if (inRect(e, BTN.back)) { sClick(); titleSel = state.level; scene = 'title'; return; }
      if (inRect(e, BTN.mute)) { setMuted(!muted); continue; }
      if (state.phase !== 'play') continue;
      if (inRect(e, BTN.guide)) { state.guideArmed = !state.guideArmed && state.guides > 0; if (state.guides <= 0) say('انتهى الدليل في هذه المرحلة', 1.6); else if (state.guideArmed) say('انقر شريطاً لترى طريقه', 1.6); sClick(); continue; }

      if (inRect(e, BTN.restart)) { restartLevel(); continue; }

      state.ptr = { x: e.x, y: e.y, sx: e.x, sy: e.y, hold: 0, moved: false, guided: false, rib: ribAt(e.x, e.y) };
      if (state.ptr.rib < 0 && state.guideArmed) state.guideArmed = false;
    } else if (e.t === 'move' && state.ptr) {
      state.ptr.x = e.x; state.ptr.y = e.y;
      if (Math.hypot(e.x - state.ptr.sx, e.y - state.ptr.sy) > state.cs * 0.45) state.ptr.moved = true;
    } else if (e.t === 'up' && state.ptr) {
      const p = state.ptr; state.ptr = null;
      if (!p.moved && !p.guided && p.rib >= 0) { if (state.guideArmed) showGuide(p.rib); else launch(p.rib); }
    } else if (e.t === 'cancel') state.ptr = null;
  }
  const p = state.ptr;
  if (p && !p.moved && !p.guided && p.rib >= 0 && state.phase === 'play') {
    p.hold += dt;
    if (p.hold >= tune.longpress_s) { p.guided = true; showGuide(p.rib); }
  }
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { drawFigures(); },
  },
  title: {
    update(dt) {
      state.t += dt;
      for (const e of pq) {
        if (e.t !== 'down') continue;
        if (location.protocol.startsWith('http') && inRect(e, BTN.home)) { location.href = '../../'; return; }
        if (inRect(e, BTN.mute)) { setMuted(!muted); continue; }
        if (inRect(e, BTN.play)) { startLevel(titleSel); return; }
        for (let i = 0; i < NLEV(); i++) if (inRect(e, levelTile(i))) { titleSel = i; startLevel(i); return; }
      }
      const n = NLEV();
      if (pressed('ArrowLeft')) titleSel = (titleSel + 1) % n;
      if (pressed('ArrowRight')) titleSel = (titleSel + n - 1) % n;
      if (pressed('ArrowDown')) titleSel = Math.min(n - 1, titleSel + 4);
      if (pressed('ArrowUp')) titleSel = Math.max(0, titleSel - 4);
      if (pressed('Enter') || pressed('Space')) startLevel(titleSel);
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      state.t += dt;
      if (pressed('Escape')) { titleSel = state.level; scene = 'title'; return; }
      handleBoardPointer(dt);
      if (scene !== 'play') return;
      if (state.phase === 'play' && state.again < 0) {
        for (let k = 0; k < 4; k++) {
          const code = ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'][k];
          if (!pressed(code)) continue;
          if (!state.kb || state.cursor < 0 || state.ribs[state.cursor].gone) {
            state.kb = true; state.cursor = nearestRib(Math.floor(state.n / 2) * (state.n + 1));
          } else { const nx = nearestRib(state.ribs[state.cursor].cells[state.ribs[state.cursor].len - 1], k); if (nx >= 0) state.cursor = nx; }
        }
        if (pressed('Space') || pressed('Enter')) {
          if (!state.kb || state.cursor < 0 || state.ribs[state.cursor].gone) { state.kb = true; state.cursor = nearestRib(Math.floor(state.n / 2) * (state.n + 1)); }
          else launch(state.cursor);
        }
        if (pressed('KeyG')) { if (state.cursor < 0) { state.kb = true; state.cursor = nearestRib(Math.floor(state.n / 2) * (state.n + 1)); } if (state.cursor >= 0) showGuide(state.cursor); }
        if (pressed('KeyH')) doHint();
        if (pressed('KeyR')) restartLevel();
      }
      animate(dt);
      if (state.phase === 'play') state.time += dt;
      if (state.again >= 0) { state.again -= dt; if (state.again < 0) { restartLevel(); state.again = -1; say('نفدت القلوب، نعيد المرحلة مجاناً', 1.8); return; } }
      if (state.phase === 'play' && state.left === 0 && state.ribs.every(r => r.done)) beginReveal();
      if (state.phase === 'reveal' && state.t >= state.revealEnd) { scene = 'results'; state.resT = 0; }
    },
    draw() { drawPlay(); },
  },
  results: {
    update(dt) {
      state.t += dt; state.resT += dt; animate(dt);
      for (const e of pq) {
        if (e.t !== 'down') continue;
        if (inRect(e, BTN.mute)) { setMuted(!muted); continue; }
        if (inRect(e, BTN.back)) { titleSel = state.level; scene = 'title'; return; }
        if (inRect(e, BTN.next)) { nextLevel(); return; }
        if (inRect(e, BTN.replay)) { startLevel(state.level); return; }
      }
      if (pressed('Enter') || pressed('Space')) nextLevel();
      else if (pressed('KeyR')) startLevel(state.level);
      else if (pressed('Escape')) { titleSel = state.level; scene = 'title'; }
    },
    draw() { drawPlay(); drawResults(); },
  },
};

      ctx.fillStyle = '#c4532c'; octagram(x, y, 90); ctx.fill();

    ctx.fillStyle = '#183a7a'; // corner diamonds: they meet as small crosses between stars

  ctx.beginPath(); ctx.moveTo(x - s * 0.2, y - s * 0.22); ctx.lineTo(x - s * 0.26, y + s * 0.14); ctx.lineTo(x, y + s * 0.3); ctx.lineTo(x + s * 0.26, y + s * 0.14); ctx.lineTo(x + s * 0.2, y - s * 0.22); ctx.closePath();
  const g = ctx.createRadialGradient(x, y, 2, x, y, s * 0.3); g.addColorStop(0, lit ? '#fffbe0' : '#fbe7a6'); g.addColorStop(1, '#e2a01a');
  ctx.fillStyle = g; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - s * 0.22); ctx.lineTo(x, y + s * 0.3); ctx.moveTo(x - s * 0.23, y - s * 0.02); ctx.lineTo(x + s * 0.23, y - s * 0.02); ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.3); ctx.lineTo(x, y + s * 0.44); ctx.lineWidth = 3; ctx.stroke();
}
function iconGuide(x, y, s) {
  for (let i = 0; i < 3; i++) {
    const cx = x - s * 0.34 + i * s * 0.2, q = s * 0.07;
    ctx.beginPath(); ctx.moveTo(cx, y - q); ctx.lineTo(cx + q, y); ctx.lineTo(cx, y + q); ctx.lineTo(cx - q, y); ctx.closePath(); ctx.fillStyle = '#14805a'; ctx.fill();
  }
  headShape(x + s * 0.22, y, 1, 0, s * 0.55); ctx.fillStyle = '#1f4fa8'; ctx.fill(); ctx.strokeStyle = '#0c2356'; ctx.lineWidth = 2; ctx.stroke();
}
function iconRestart(x, y, s) {
  ctx.strokeStyle = INK; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, s * 0.28, -Math.PI * 0.35, Math.PI * 1.35); ctx.stroke();
  const a = -Math.PI * 0.35, ex = x + Math.cos(a) * s * 0.28, ey = y + Math.sin(a) * s * 0.28;
  ctx.beginPath(); ctx.moveTo(ex + s * 0.16, ey - s * 0.02); ctx.lineTo(ex - s * 0.04, ey - s * 0.14); ctx.lineTo(ex - s * 0.02, ey + s * 0.1); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
}
function iconMute(x, y, s, off) {
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(x - s * 0.3, y - s * 0.1); ctx.lineTo(x - s * 0.14, y - s * 0.1); ctx.lineTo(x + s * 0.06, y - s * 0.28);
  ctx.lineTo(x + s * 0.06, y + s * 0.28); ctx.lineTo(x - s * 0.14, y + s * 0.1); ctx.lineTo(x - s * 0.3, y + s * 0.1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = s * 0.06; ctx.lineCap = 'round';
  if (off) { ctx.strokeStyle = '#b3261e'; ctx.beginPath(); ctx.moveTo(x + s * 0.14, y - s * 0.14); ctx.lineTo(x + s * 0.34, y + s * 0.14); ctx.moveTo(x + s * 0.34, y - s * 0.14); ctx.lineTo(x + s * 0.14, y + s * 0.14); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(x + s * 0.06, y, s * 0.16, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(x + s * 0.06, y, s * 0.3, -0.8, 0.8); ctx.stroke(); }
}
function iconLevels(x, y, s) {
  for (let i = 0; i < 4; i++) {
    const cx = x + (i % 2 ? 1 : -1) * s * 0.16, cy = y + (i > 1 ? 1 : -1) * s * 0.16;
    octagram(cx, cy, s * 0.15, 0.7); ctx.fillStyle = GL[[0, 1, 3, 2][i]].base; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
function iconHome(x, y, s) {
  ctx.fillStyle = '#c4532c'; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * 0.34, y - s * 0.02); ctx.lineTo(x, y - s * 0.34); ctx.lineTo(x + s * 0.34, y - s * 0.02); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f8f1e2'; ctx.beginPath(); ctx.rect(x - s * 0.24, y - s * 0.02, s * 0.48, s * 0.32); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1f4fa8'; ctx.beginPath(); ctx.rect(x - s * 0.07, y + s * 0.1, s * 0.14, s * 0.2); ctx.fill();
}
function drawHud() {
  tileButton(BTN.back); iconLevels(BTN.back.x + 46, BTN.back.y + 46, 80);
  tileButton(BTN.mute); iconMute(BTN.mute.x + 46, BTN.mute.y + 46, 80, muted);

  if (tip) {
    ctx.font = `30px ${FONT}`; const tw = Math.min(680, ctx.measureText(tip).width + 50);
    ctx.fillStyle = state.msgT > 0 ? 'rgba(58,44,30,0.88)' : 'rgba(255,250,240,0.75)'; rr(W / 2 - tw / 2, 978, tw, 58, 29); ctx.fill();

function drawResults() {
  const w = state.win, u = clamp(state.resT / 0.35, 0, 1);
  const py = 950 + (1 - ease(u)) * 300;
  ctx.fillStyle = 'rgba(60,35,10,0.25)'; rr(30, py + 8, 660, 320, 30); ctx.fill();
  ctx.fillStyle = '#fbf6ec'; rr(30, py, 660, 320, 30); ctx.fill(); ctx.strokeStyle = '#c4532c'; ctx.lineWidth = 5; ctx.stroke();
  const last = state.level + 1 >= NLEV();
  text(last ? 'أتممت الفناء كله!' : 'اكتمل الزليج!', W / 2, py + 50, 46, INK, 'center', 'bold');
  for (let i = 0; i < 3; i++) {
    const k = clamp((state.resT - 0.3 - i * 0.22) / 0.25, 0, 1), s = 36 * (i < w.stars ? (0.6 + 0.4 * ease(k) + Math.sin(k * Math.PI) * 0.25) : 1);
    star8(W / 2 + (1 - i) * 100, py + 128, s, i < w.stars && k > 0);
  }
  text(`الوقت ${w.time.toFixed(1)} ث · الأفضل ${w.best.time.toFixed(1)} ث${w.newBest ? ' · رقم جديد' : ''}`, W / 2, py + 192, 28, INK2);
  BTN.next.y = py + 220; BTN.replay.y = py + 220;
  tileButton(BTN.next, true); text(last ? 'إلى البداية' : 'التالي', BTN.next.x + BTN.next.w / 2, BTN.next.y + 48, 34, INK, 'center', 'bold');
  tileButton(BTN.replay); text('إعادة', BTN.replay.x + BTN.replay.w / 2, BTN.replay.y + 48, 34, INK);
  if (last) text(`مجموع النجوم ${totalStars()} من ${NLEV() * 3}`, W / 2, py - 30, 30, INK, 'center', 'bold');
}

// ---- Drawing: the title ------------------------------------------------------------------
function drawTitle() {
  drawBackground();
  for (let i = 0; i < 8; i++) { // a glazed frieze
    const s = 90, x = i * s, y = 132;
    ctx.drawImage(glazedTileCanvas(s, [2, 1, 0, 3][i % 4]), x, y, s, s);
  }
  ctx.fillStyle = '#9c3c1c'; ctx.fillRect(0, 126, W, 6); ctx.fillRect(0, 222, W, 6);
  text('سهام الزليج', W / 2, 312, 92, '#0c2356', 'center', 'bold');
  text('Zellige Arrows', W / 2, 394, 34, INK2);
  // three demo ribbons
  const demo = [
    { pts: [[110, 470], [170, 470], [170, 510], [240, 510]], col: 0, ux: 1, uy: 0 },
    { pts: [[330, 520], [390, 520], [390, 470]], col: 1, ux: 0, uy: -1 },
    { pts: [[480, 470], [540, 470], [600, 470]], col: 3, ux: 1, uy: 0 },
  ];
  const wob = Math.sin(state.t * 2) * 4;
  for (const d of demo) {
    const pts = d.pts.map(p => [p[0] + d.ux * wob, p[1] + d.uy * wob]);
    drawRibbonBody({ col: d.col, len: 3 }, 26, { geom: { pts, ux: d.ux, uy: d.uy, tx: pts[1][0] - pts[0][0], ty: pts[1][1] - pts[0][1] }, cs: 62 });
  }
  tileButton(BTN.play, true);
  text('ابدأ', W / 2, BTN.play.y + 42, 46, INK, 'center', 'bold');
  text(`المرحلة ${titleSel + 1}`, W / 2, BTN.play.y + 88, 26, INK2);
  text(`النجوم ${totalStars()} من ${NLEV() * 3}`, W / 2, 698, 26, INK2);
  for (let i = 0; i < NLEV(); i++) {
    const b = levelTile(i), best = save.best[i];
    tileButton(b, i === titleSel);
    text(`${i + 1}`, b.x + b.w / 2, b.y + 42, 40, i >= 6 ? '#62220e' : INK, 'center', 'bold');
    for (let k = 0; k < 3; k++) star8(b.x + b.w / 2 + (1 - k) * 34, b.y + 92, 13, best && k < best.stars);
  }
  CONTROLS.forEach((c, i) => text(c, W / 2, 1168 + i * 46, i ? 24 : 28, i ? INK2 : INK));
  if (location.protocol.startsWith('http')) { tileButton(BTN.home); iconHome(BTN.home.x + 46, BTN.home.y + 48, 80); }
  tileButton(BTN.mute); iconMute(BTN.mute.x + 46, BTN.mute.y + 46, 80, muted);
}

// ---- Drawing: the figures sheet (every unit, its name under it) ------------------------------
function drawFigures() {
  drawBackground();
  text('أشكال اللعبة', W / 2, 50, 40, INK, 'center', 'bold');
  const cs = 90, w = cs * tune.ribbon_width;
  const fig = (cells, dir, col, extra = {}) => {
    const r = { len: cells.length, col, pts: cells.map(p => [p[0], p[1]]) };
    const h = cells[cells.length - 1]; r.pts.push([h[0] + DX[dir], h[1] + DY[dir]]);
    return Object.assign(r, extra);
  };
  const place = (ox, oy, r) => {
    const pts = subPath(r.pts, r.len === 1 ? -0.32 : 0, r.len - 1).map(p => [ox + p[0] * cs, oy + p[1] * cs]);
    const tg = tangentAt(r.pts, r.len - 1), tl = tangentAt(r.pts, 0);
    return { pts, ux: tg[0], uy: tg[1], tx: tl[0], ty: tl[1] };
  };
  const label = (s, x, y) => text(s, x, y, 24, INK);
  const cell = (ox, oy, k, h) => { ctx.fillStyle = 'rgba(255,250,240,0.55)'; rr(ox - 10, oy - 10, k, h, 14); ctx.fill(); };
  // row 1: straight, bent, single head
  cell(20, 90, 220, 190); const a = fig([[0.5, 0.5], [1.5, 0.5]], 0, 0); drawRibbonBody(a, w, { geom: place(20, 110, a), cs }); label('شريط مستقيم', 120, 260);
  cell(250, 90, 220, 190); const b = fig([[0.5, 0.5], [0.5, 1.2], [1.5, 1.2]], 0, 1); drawRibbonBody(b, w, { geom: place(270, 78, b), cs }); label('شريط منحنٍ', 350, 260);
  cell(480, 90, 220, 190); const c = fig([[0.5, 0.5]], 3, 2); drawRibbonBody(c, w, { geom: place(550, 120, c), cs }); label('رأس منفرد', 590, 260);
  // row 2: locked ribbon with its knot, key ribbon with its tassel
  cell(20, 300, 330, 190); const d = fig([[0.5, 0.5], [1.5, 0.5], [2.5, 0.5]], 0, 4); const gd = place(30, 330, d); drawRibbonBody(d, w, { geom: gd, cs });
  drawKnot(30 + 1.5 * cs, 330 + 0.5 * cs, 1, 0, w, 2); label('شريط معقود', 185, 470);
  cell(370, 300, 330, 190); const e = fig([[0.5, 0.5], [1.5, 0.5], [2.5, 0.5]], 0, 2); const ge = place(400, 330, e); drawRibbonBody(e, w, { geom: ge, cs });
  drawTassel(ge.pts[0][0], ge.pts[0][1], 1, 0, w, 2); label('شريط الشرّابة', 535, 470);
  // row 3: hearts, tiles
  cell(20, 510, 160, 170); drawHeart(100, 580, 70, 'full', -1); label('قلب', 100, 655);
  cell(190, 510, 160, 170); drawHeart(270, 580, 70, 'lost', 0.1); label('قلب مكسور', 270, 655);
  cell(360, 510, 160, 170); plasterTile(400, 530, 80, 5); ctx.strokeStyle = GROUT; ctx.lineWidth = 3; ctx.strokeRect(400, 530, 80, 80); label('بلاط جصّي', 440, 655);
  cell(530, 510, 170, 170); ctx.drawImage(glazedTileCanvas(80, 1), 575, 530, 80, 80); label('بلاط مزجّج', 615, 655);
  // row 4: the HUD pieces
  const icons = [['فانوس التلميح', (x, y) => iconLantern(x, y, 90, true)], ['الدليل', (x, y) => iconGuide(x, y, 96)], ['إعادة', (x, y) => iconRestart(x, y, 92)],
    ['نجمة', (x, y) => star8(x, y, 36, true)]];
  icons.forEach(([n, f], i) => { const x = 95 + i * 175; cell(x - 80, 700, 160, 170); f(x, 770); label(n, x, 845); });
  const icons2 = [['الصوت', (x, y) => iconMute(x, y, 80, false)], ['المراحل', (x, y) => iconLevels(x, y, 80)], ['البيت', (x, y) => iconHome(x, y, 80)],
    ['عقدة القفل', (x, y) => drawKnot(x, y, 1, 0, 44, 0)]];
  icons2.forEach(([n, f], i) => { const x = 95 + i * 175; cell(x - 80, 890, 160, 170); f(x, 960); label(n, x, 1035); });
  // the cursor glow on a ribbon
  cell(20, 1080, 680, 170);
  const g = fig([[0.5, 0.5], [1.5, 0.5], [2.5, 0.5], [3.5, 0.5]], 0, 0); const gg = place(170, 1110, g);
  ctx.save(); ctx.globalAlpha = 0.7; ctx.strokeStyle = '#f2b632'; ctx.lineWidth = w + 18; ctx.lineCap = 'round'; trace(gg.pts, cs * 0.42); ctx.stroke(); ctx.restore();
  drawRibbonBody(g, w, { geom: gg, cs }); label('مؤشر لوحة المفاتيح', 360, 1225);
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); pq.length = 0;
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx = mainCtx; scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

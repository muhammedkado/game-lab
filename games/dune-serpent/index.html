    },
    draw() {
      drawWorld(); drawHUD();
      ctx.fillStyle = 'rgba(8,6,28,0.66)'; ctx.fillRect(0, 0, W, H);
      text('استراحة', W / 2, 400, 72, '#fff', 'center', 'bold');
      bigButton(BTN_RESUME, 'متابعة', true); bigButton(BTN_RESTART, 'جولة جديدة'); bigButton(BTN_QUIT, 'القائمة');
      text('P أو Esc للمتابعة', W / 2, 950, 26, '#c9c6f0', 'center');
    },
  },
  results: {
    update() {
      if (pressed('Enter') || pressed('Space') || pressed('KeyR')) { startRound(); return; }
      if (pressed('Escape')) { reset(); scene = 'title'; return; }
      for (const p of tapList) {
        if (inRect(p, BTN_AGAIN)) { startRound(); return; }
        if (inRect(p, BTN_MENU)) { reset(); scene = 'title'; return; }
      }
    },
    draw() {
      drawWorld(); drawHUD();
      ctx.fillStyle = 'rgba(8,6,28,0.7)'; ctx.fillRect(0, 0, W, H);
      const R = state.result;
      ctx.fillStyle = 'rgba(24,20,62,0.96)'; rr(ctx, 50, 110, 620, 1110, 30); ctx.fill();
      ctx.strokeStyle = PALS[0].base; ctx.lineWidth = 6; rr(ctx, 60, 120, 600, 1090, 24); ctx.stroke();
      let head, sub;
      if (R.reason === 'last') { head = 'فزت بالجولة'; sub = 'آخر أفعى حيّة في الكثبان'; }
      else if (R.reason === 'time') { head = R.rank === 1 ? 'فزت بالجولة' : 'انتهى الوقت'; sub = R.rank === 1 ? 'أطول أفعى حيّة عند النهاية' : `مركزك ${R.rank} من ${snakes.length}`; }
      else { head = 'خرجت من الجولة'; sub = state.why === 'storm' ? 'ابتلعتك العاصفة' : `اصطدم رأسك بجسد ${PALS[state.killer].name}`; }
      text(head, W / 2, 200, 56, '#fff', 'center', 'bold');
      text(sub, W / 2, 268, 30, '#ffd9a8', 'center');
      text(`طولك ${R.fin}`, W / 2, 344, 48, PALS[0].light, 'center', 'bold');
      text(R.newBest ? 'رقم شخصي جديد' : `أطول أفعى لك: ${state.best}`, W / 2, 402, 28, R.newBest ? '#ffe08a' : '#c9c6f0', 'center', 'bold');
      R.stand.forEach((s, k) => {
        const y = 462 + k * 48, P = PALS[s.id];
        if (s.id === 0) { ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(ctx, 100, y - 22, 520, 44, 12); ctx.fill(); }
        text(`${k + 1}`, 596, y, 28, '#c9c6f0', 'center', 'bold');
        ctx.fillStyle = P.base; ctx.strokeStyle = P.dark; ctx.lineWidth = 3; circ(ctx, 556, y, 12); ctx.fill(); ctx.stroke();
        text(s.id === 0 ? 'أنت' : `${P.name} · ${KIND_AR[P.kind]}`, 534, y, 26, s.alive ? '#fff' : '#9a98b8', 'right', s.id === 0 ? 'bold' : '');
        text(s.alive ? `${Math.floor(s.len)}` : `خارج · ${Math.floor(s.len)}`, 120, y, 26, s.alive ? '#ffd27a' : '#9a98b8', 'left', 'bold');
      });
      text(`أفاعٍ اصطدمت بك: ${state.kills}`, W / 2, 900, 28, '#c9c6f0', 'center');
      if (state.unlocked >= 0) text(`فتحت ${TIERS[state.unlocked].name}: تجدها في القائمة`, W / 2, 944, 28, TIERS[state.unlocked].col, 'center', 'bold');
      else text(`${TIERS[state.tier].name}${state.revived ? ' · استعملت العودة المجانية' : ''}`, W / 2, 944, 26, TIERS[state.tier].col, 'center', 'bold');
      bigButton(BTN_AGAIN, 'العب مجددًا', true); bigButton(BTN_MENU, 'القائمة');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  tapList = taps.splice(0);
  scenes[scene].update(STEP); hit.clear(); tapList = [];
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') scene = 'pause'; });

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

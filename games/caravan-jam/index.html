<script>
'use strict';
// Caravan Jam: lead camels out of a jammed caravanserai courtyard to four loading posts at the
// gate; travellers in matching robes climb on; full camels leave through the arch.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.posts is CONFIG.posts.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: portrait phone
const PIXEL = false;
const FONT = 'Almarai, "SF Arabic", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif'; // Almarai: vendor/almarai.css
const TITLE = 'زحمة القافلة · Caravan Jam';
const CONTROLS = [
  'اضغط جملاً طريقه مفتوح ليذهب إلى المربط',
  'يركب المسافرون الجمل الذي بلون ثيابهم',
  'الأسهم: اختيار · مسافة: إخراج',
  'U تراجع · R إعادة · M صوت',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const screenCtx = canvas.getContext('2d');
let ctx = screenCtx;
let bgCanvas = null, bgKey = '';
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  screenCtx.setTransform(r, 0, 0, r, 0, 0); screenCtx.imageSmoothingEnabled = !PIXEL;
  bgKey = '';
}
addEventListener('resize', fit); fit();
const AR = /[؀-ۿ]/;
function text(s, x, y, size, c, align = 'center', weight = 700) {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.direction = AR.test(s) ? 'rtl' : 'ltr';
  ctx.fillText(s, x, y); ctx.direction = 'ltr';
}
function textOutline(s, x, y, size, c, outline, lw) {
  ctx.font = `800 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.direction = AR.test(s) ? 'rtl' : 'ltr'; ctx.lineJoin = 'round';
  ctx.strokeStyle = outline; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y); ctx.direction = 'ltr';
}

// ---- Input: keys by position (event.code), OS key repeat ignored; taps queued for the step --
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());
const tapQueue = []; let taps = [];
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); startAudio();
  const r = canvas.getBoundingClientRect();
  tapQueue.push({ x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
});
['pointermove', 'pointerup', 'pointercancel'].forEach(n => canvas.addEventListener(n, e => e.preventDefault()));
canvas.addEventListener('contextmenu', e => e.preventDefault());
function inRect(p, x, y, w, h) { return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const AC = window.GAME_AUDIO ? null : (window.AudioContext || window.webkitAudioContext);
    if (!window.GAME_AUDIO && !AC) return;
    const ac = window.GAME_AUDIO || new AC(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  tap() { tone(330, 0.08, 'triangle', 0.25); tone(494, 0.1, 'triangle', 0.2, 0.06); },
  blocked() { tone(120, 0.14, 'square', 0.12); tone(92, 0.2, 'square', 0.1, 0.09); },
  park() { tone(150, 0.12, 'triangle', 0.3); },
  board(k) { tone(587 + k * 74, 0.07, 'sine', 0.22); },
  bell() { [1568, 2093, 1760, 2349].forEach((f, i) => tone(f, 0.4, 'sine', 0.1, i * 0.075)); tone(3136, 0.25, 'sine', 0.04, 0.03); },
  stuck() { tone(392, 0.2, 'sawtooth', 0.1); tone(330, 0.2, 'sawtooth', 0.1, 0.17); tone(247, 0.45, 'sawtooth', 0.1, 0.34); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.28, 'triangle', 0.18, i * 0.09)); },
  undo() { tone(523, 0.07, 'sine', 0.2); tone(392, 0.1, 'sine', 0.2, 0.06); },
  ui() { tone(660, 0.05, 'sine', 0.18); },
};

// ---- Saved personal bests (the game works without storage) -------------------------------
const SAVE_KEY = 'caravan-jam-save-v1';
let save = { stars: [], unlocked: 1 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.stars)) save = s; } catch (e) { /* no storage */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* no storage */ } }
function totalStars() { return save.stars.reduce((a, b) => a + (b || 0), 0); }

// ---- Small drawing helpers ----------------------------------------------------------------
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeInOut = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function hash(a, b = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function drawStar(x, y, r, on) {
  starPath(x, y, r); ctx.fillStyle = on ? '#ffcf3f' : 'rgba(60,35,20,0.55)'; ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.14); ctx.strokeStyle = on ? '#8a5a00' : 'rgba(240,220,180,0.5)'; ctx.lineJoin = 'round'; ctx.stroke();
}
function checkMark(x, y, s, c) {
  ctx.strokeStyle = c; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.12, y + s * 0.32); ctx.lineTo(x + s * 0.5, y - s * 0.38); ctx.stroke();
}

// ---- The look: palette, camels, travellers, posts, gate -----------------------------------
const PAL = [
  { robe: '#d4463a', dark: '#8c2219', light: '#f39a86', wrap: '#fbd9cc' },
  { robe: '#2f7dd0', dark: '#174a82', light: '#8cc1f2', wrap: '#d6e8fa' },
  { robe: '#3ca04f', dark: '#1d6430', light: '#8fd69a', wrap: '#d6f2d8' },
  { robe: '#f3b81d', dark: '#8a5e00', light: '#ffe17a', wrap: '#fff3c8' },
  { robe: '#9150c6', dark: '#52267a', light: '#c9a0ea', wrap: '#eddcf9' },
];
const COLOUR_ADJ = ['أحمر', 'أزرق', 'أخضر', 'أصفر', 'بنفسجياً'];
const FUR = { small: ['#c58d52', '#e2b47c', '#6b4220'], big: ['#a46f3c', '#c8925c', '#5a361a'] };
let gt = 0; // animation time for idle motion (title, figures and play)

function camelGeom(len, c) {
  const L = len * c, half = L / 2;
  const headLen = c * 0.47, headW = c * 0.31, neckLen = c * 0.28;
  const bodyBack = -half + c * 0.06, bodyFront = half - headLen - neckLen + c * 0.14;
  const bodyLen = bodyFront - bodyBack, bodyMid = (bodyFront + bodyBack) / 2, bodyW = c * 0.68;
  return { L, half, headLen, headW, neckLen, bodyBack, bodyFront, bodyLen, bodyMid, bodyW };
}
function seatLocal(len, c, k) {
  const g = camelGeom(len, c);
  if (len === 3) return [g.bodyMid + ((k % 3) - 1) * c * 0.34, (k < 3 ? -1 : 1) * g.bodyW * 0.22];
  return [g.bodyMid + (k - 1) * c * 0.29, 0];
}
function blanketPattern(ci, x0, x1, y, c, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1, c * 0.018);
  const step = c * 0.11, a = c * 0.025;
  if (ci === 0) { ctx.beginPath(); for (let x = x0, k = 0; x <= x1; x += step / 2, k++) ctx.lineTo(x, y + (k % 2 ? a : -a)); ctx.stroke(); }
  else if (ci === 1) { for (let x = x0 + step / 2; x < x1; x += step) { ell(x, y, a, a); ctx.fill(); } }
  else if (ci === 2) { for (let x = x0 + step / 4; x < x1; x += step) { ctx.beginPath(); ctx.moveTo(x, y - a); ctx.lineTo(x + step * 0.5, y + a); ctx.stroke(); } }
  else if (ci === 3) { for (let x = x0 + step / 2; x < x1; x += step) { ctx.beginPath(); ctx.moveTo(x - a * 1.4, y); ctx.lineTo(x, y - a * 1.4); ctx.lineTo(x + a * 1.4, y); ctx.lineTo(x, y + a * 1.4); ctx.closePath(); ctx.fill(); } }
  else { for (let x = x0 + step / 2; x < x1; x += step) { ctx.beginPath(); ctx.moveTo(x - a, y - a); ctx.lineTo(x + a, y + a); ctx.moveTo(x + a, y - a); ctx.lineTo(x - a, y + a); ctx.stroke(); } }
}
function drawRider(x, y, c, ci) {
  const P = PAL[ci];
  ctx.fillStyle = P.dark; ell(x - c * 0.015, y, c * 0.095, c * 0.125); ctx.fill();
  ctx.fillStyle = P.wrap; ell(x + c * 0.01, y, c * 0.072, c * 0.072); ctx.fill();
  ctx.strokeStyle = P.dark; ctx.lineWidth = Math.max(1, c * 0.018); ctx.stroke();
  ctx.strokeStyle = P.robe; ctx.lineWidth = Math.max(1, c * 0.022);
  ctx.beginPath(); ctx.arc(x + c * 0.01, y, c * 0.042, -1.1, 1.3); ctx.stroke();
}
// A camel seen from above. (cx, cy) its middle, ang its facing, len cells long, c the cell size.
function drawCamel(cx, cy, ang, len, c, ci, fill, o) {
  o = o || {};
  const P = PAL[ci], big = len === 3, g = camelGeom(len, c);
  const [fur, furL, furD] = big ? FUR.big : FUR.small;
  const ph = o.ph || 0, bob = (o.bob || 0) * c;
  const lw = Math.max(1.2, c * 0.03);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // shadow
  ctx.fillStyle = 'rgba(70,40,15,0.26)';
  ell(g.bodyMid + c * 0.05, c * 0.07, g.bodyLen * 0.54, g.bodyW * 0.6); ctx.fill();
  ell(g.half - g.headLen * 0.5 + c * 0.05 + bob, c * 0.07, g.headLen * 0.55, g.headW * 0.6); ctx.fill();
  if (o.glow) { ctx.strokeStyle = o.glow; ctx.lineWidth = c * 0.1; ell(g.bodyMid + c * 0.1, 0, g.bodyLen / 2 + c * 0.22, g.bodyW / 2 + c * 0.13); ctx.stroke(); }
  // legs: tucked knees when resting, striding legs when walking
  ctx.fillStyle = furD;
  if (o.walk != null) {
    const sw = Math.sin(o.walk) * c * 0.14;
    for (const [kx, s, d] of [[g.bodyFront - c * 0.18, -1, 1], [g.bodyFront - c * 0.18, 1, -1], [g.bodyBack + c * 0.2, -1, -1], [g.bodyBack + c * 0.2, 1, 1]]) {
      ell(kx + sw * d, s * g.bodyW * 0.48, c * 0.1, c * 0.055); ctx.fill();
    }
  } else {
    for (const kx of [g.bodyFront - c * 0.2, g.bodyBack + c * 0.22]) for (const s of [-1, 1]) { ell(kx, s * g.bodyW * 0.46, c * 0.12, c * 0.07); ctx.fill(); }
  }
  // tail
  const tw = Math.sin(gt * 3 + ph) * c * 0.05;
  ctx.strokeStyle = furD; ctx.lineWidth = c * 0.045;
  ctx.beginPath(); ctx.moveTo(g.bodyBack + c * 0.05, 0); ctx.quadraticCurveTo(g.bodyBack - c * 0.06, tw * 0.5, g.bodyBack - c * 0.14, tw); ctx.stroke();
  ell(g.bodyBack - c * 0.17, tw, c * 0.06, c * 0.04); ctx.fill();
  // neck
  const nx0 = g.bodyFront - c * 0.16, nx1 = g.half - g.headLen * 0.75 + bob;
  ctx.fillStyle = fur; ctx.strokeStyle = furD; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(nx0, -c * 0.17); ctx.quadraticCurveTo((nx0 + nx1) / 2, -c * 0.085, nx1, -c * 0.085);
  ctx.lineTo(nx1, c * 0.085); ctx.quadraticCurveTo((nx0 + nx1) / 2, c * 0.085, nx0, c * 0.17); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (big) { // shaggy mane along the neck
    ctx.strokeStyle = furD; ctx.lineWidth = Math.max(1, c * 0.025);
    for (let k = 0; k < 4; k++) { const x = lerp(nx0 + c * 0.05, nx1 - c * 0.02, k / 3); ctx.beginPath(); ctx.moveTo(x - c * 0.03, -c * 0.05); ctx.lineTo(x + c * 0.03, c * 0.05); ctx.stroke(); }
  }
  // body
  ctx.fillStyle = fur; ctx.strokeStyle = furD; ctx.lineWidth = lw;
  ell(g.bodyMid, 0, g.bodyLen / 2, g.bodyW / 2); ctx.fill(); ctx.stroke();
  // head: ears, skull, muzzle, nostrils, eyes, halter
  const hx = g.half - g.headLen / 2 + bob;
  const flick = Math.sin(gt * 2.3 + ph * 3) > 0.93 ? 0.45 : 0;
  ctx.fillStyle = fur;
  for (const s of [-1, 1]) { ell(hx - g.headLen * 0.33, s * g.headW * 0.56, c * 0.065, c * 0.035, s * (0.6 + flick)); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = furL; ell(hx, 0, g.headLen / 2, g.headW / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8c5a34'; ell(hx + g.headLen * 0.3, 0, g.headLen * 0.2, g.headW * 0.4); ctx.fill();
  ctx.fillStyle = '#2e1a0b';
  for (const s of [-1, 1]) { ell(hx + g.headLen * 0.42, s * g.headW * 0.15, c * 0.02, c * 0.013); ctx.fill(); }
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#1e1008'; ell(hx - g.headLen * 0.06, s * g.headW * 0.38, c * 0.036, c * 0.03); ctx.fill();
    ctx.fillStyle = '#fff'; ell(hx - g.headLen * 0.04, s * g.headW * 0.38 - c * 0.008, c * 0.011, c * 0.011); ctx.fill();
  }
  ctx.strokeStyle = P.robe; ctx.lineWidth = Math.max(1.5, c * 0.035);
  ctx.beginPath(); ctx.moveTo(hx + g.headLen * 0.12, -g.headW * 0.48); ctx.lineTo(hx + g.headLen * 0.12, g.headW * 0.48); ctx.stroke();
  // humps and saddle blanket
  const bw = g.bodyW * 1.14;
  const blanket = (bl) => {
    const x0 = g.bodyMid - bl / 2, nt = big ? 4 : 3;
    ctx.strokeStyle = P.dark; ctx.lineWidth = Math.max(1, c * 0.022);
    for (let i = 0; i < nt; i++) {
      const x = x0 + bl * (i + 0.5) / nt;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(x, s * bw * 0.45); ctx.lineTo(x, s * (bw / 2 + c * 0.075)); ctx.stroke();
        ctx.fillStyle = '#f4d46a'; ell(x, s * (bw / 2 + c * 0.09), c * 0.034, c * 0.034); ctx.fill();
      }
    }
    rrect(x0, -bw / 2, bl, bw, c * 0.09); ctx.fillStyle = P.robe; ctx.fill();
    ctx.strokeStyle = P.dark; ctx.lineWidth = lw; ctx.stroke();
    const ins = c * 0.075;
    rrect(x0 + ins, -bw / 2 + ins, bl - 2 * ins, bw - 2 * ins, c * 0.05);
    ctx.strokeStyle = P.light; ctx.lineWidth = Math.max(1, c * 0.022); ctx.stroke();
    for (const s of [-1, 1]) blanketPattern(ci, x0 + ins, x0 + bl - ins, s * (bw / 2 - ins / 2), c, P.light);
  };
  const hump = (x, rx, ry) => {
    const gr = ctx.createRadialGradient(x - rx * 0.2, -ry * 0.25, 1, x, 0, Math.max(rx, ry));
    gr.addColorStop(0, furL); gr.addColorStop(1, fur);
    ctx.fillStyle = gr; ell(x, 0, rx, ry); ctx.fill(); ctx.strokeStyle = furD; ctx.lineWidth = lw * 0.8; ctx.stroke();
  };
  if (big) {
    blanket(g.bodyLen * 0.52);
    for (const s of [-1, 1]) {
      const x = g.bodyMid + s * g.bodyLen * 0.34; hump(x, c * 0.22, g.bodyW * 0.36);
      ctx.strokeStyle = furD; ctx.lineWidth = Math.max(1, c * 0.02);
      for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(x + k * c * 0.06, -c * 0.04); ctx.lineTo(x + k * c * 0.06 + c * 0.02, c * 0.04); ctx.stroke(); }
    }
  } else {
    hump(g.bodyMid, g.bodyLen * 0.38, g.bodyW * 0.4);
    blanket(g.bodyLen * 0.62);
  }
  // seats and riders
  const seats = o.seats || (big ? 6 : 3);
  for (let k = 0; k < seats; k++) {
    const [sx, sy] = seatLocal(len, c, k);
    if (k < fill) drawRider(sx, sy, c, ci);
    else { ctx.fillStyle = P.dark; ell(sx, sy, c * 0.08, c * 0.08); ctx.fill(); ctx.strokeStyle = P.light; ctx.lineWidth = Math.max(1, c * 0.02); ctx.stroke(); }
  }
  // neck bell
  ctx.fillStyle = '#e9c24a'; ell(g.bodyFront + c * 0.01, 0, c * 0.055, c * 0.055); ctx.fill();
  ctx.strokeStyle = '#7d5c10'; ctx.lineWidth = Math.max(1, c * 0.02); ctx.stroke();
  if (o.flash) { ctx.fillStyle = `rgba(255,60,40,${o.flash})`; ell(g.bodyMid, 0, g.bodyLen / 2 + c * 0.05, g.bodyW / 2 + c * 0.06); ctx.fill(); }
  ctx.restore();
}
// A traveller seen from above; variant 0 carries a bundle, 1 a staff, 2 a water skin.
function drawTraveller(x, y, ci, variant, ang, s, step) {
  const P = PAL[ci];
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(60,35,15,0.28)'; ell(2, 3, 16, 19); ctx.fill();
  const f = Math.sin(step || 0) * 4;

// ---- Poses: where each camel is drawn right now -----------------------------------------------
function camelPose(i) {
  const lv = state.lv, cm = lv.camels[i], v = state.vc[i], t = state.t, bc = tune.bay_cell, gc = lv.geo.cell;
  if (v.leave && t >= v.leave.t0) {
    if (t >= v.leave.t1) return null;
    const u = (t - v.leave.t0) / (v.leave.t1 - v.leave.t0);
    const s = v.leave.s0 + (v.leave.path.total - v.leave.s0) * easeIn(u);
    return trainPose(v.leave.path, s, cm.len, bc, 'leave');
  }
  if (v.walk) {
    if (t < v.walk.t0) return gridPose(i);
    if (t < v.walk.t1) {
      const u = (t - v.walk.t0) / (v.walk.t1 - v.walk.t0);
      const s = v.walk.s0 + (v.walk.path.total - v.walk.s0) * easeInOut(u);
      const cell = s <= v.walk.sExit ? gc : lerp(gc, bc, clamp((s - v.walk.sExit) / 170, 0, 1));
      return trainPose(v.walk.path, s, cm.len, cell, 'walk');
    }
    return parkPose(i);
  }
  if (v.gone) return null;
  if (v.parked) return parkPose(i);

}
function trainPose(path, s, len, cell, phase) {
  const h = pathAt(path, s), tl = pathAt(path, s - len * cell);
  return { x: (h[0] + tl[0]) / 2, y: (h[1] + tl[1]) / 2, ang: Math.atan2(h[1] - tl[1], h[0] - tl[0]), cell, phase, walk: s / (cell * 0.35) };
}
function parkPose(i) {
  const cm = state.lv.camels[i], bc = tune.bay_cell, bx = bayX(state.vc[i].slot);
  return { x: bx, y: BAY_HEAD - cm.len * bc / 2, ang: Math.PI / 2, cell: bc, phase: 'park' };
}
function gridPose(i) {
  const q = gridGeom(i), v = state.vc[i], t = state.t;

  if (t - v.shakeT < 0.4) off = Math.sin((t - v.shakeT) * 45) * state.lv.geo.cell * 0.07 * (1 - (t - v.shakeT) / 0.4);

}

  return [p.x - sy, p.y + sx];
}

  title: {
    update() {
      const L = Math.min(save.unlocked || 1, tune.levels);
      if (pressed('Enter') || pressed('Space')) { startLevel(L); scene = 'play'; sfx.ui(); return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...TITLE_BTNS.mute)) { setMuted(!muted); continue; }
        if (location.protocol.startsWith('http') && inRect(p, ...TITLE_BTNS.home)) { location.href = '../../'; return; }
        if (inRect(p, ...TITLE_BTNS.start)) { startLevel(L); scene = 'play'; sfx.ui(); return; }
        for (let i = 0; i < tune.levels; i++) if (inRect(p, ...levelBtn(i)) && i + 1 <= (save.unlocked || 1)) { startLevel(i + 1); scene = 'play'; sfx.ui(); return; }
      }
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      state.t += dt;
      playInput();
      if (scene !== 'play') return;
      updatePlayWorld(dt);
      if (state.pending && state.t >= state.busyUntil + 0.35) {
        if (state.pending === 'win') { state.winT = state.t; finishLevel(); }
        else { scene = 'over'; sfx.stuck(); events.push({ type: 'stuck', level: state.level }); state.gained = 'القافلة عالقة'; }
      }
    },
    draw() { drawPlay(); },
  },
  over: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      if (pressed('KeyR') || pressed('Enter') || pressed('Space')) { doRestart(); return; }
      if (pressed('KeyU')) { doUndo(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...OVER_BTNS.restart)) { doRestart(); return; }
        if (inRect(p, ...OVER_BTNS.undo) && state.undos > 0 && state.hist.length) { doUndo(); return; }
      }
    },
    draw() { drawOver(); },
  },
  results: {
    update(dt) {
      state.t += dt; updatePlayWorld(dt);
      const L = state.level, next = () => { if (L >= tune.levels) scene = 'title'; else { startLevel(L + 1); scene = 'play'; } sfx.ui(); };
      if (pressed('Enter') || pressed('Space')) { next(); return; }
      if (pressed('KeyR')) { doRestart(); return; }
      if (pressed('Escape')) { scene = 'title'; return; }
      let p;
      while ((p = takeTap())) {
        if (inRect(p, ...RES_BTNS.next)) { next(); return; }
        if (inRect(p, ...RES_BTNS.again)) { doRestart(); return; }
      }
    },
    draw() { drawResults(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  taps = tapQueue.splice(0);
  gt += STEP;
  scenes[scene].update(STEP); hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
